
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<div id="app-root"></div>
<style>
  @font-face{ font-family:'sysfallback'; }
  :root{
    --ink:#171B22;
    --paper:#EEF0F4;
    --tag:#EEF1F6;
    --red:#DC2626;
    --red-dark:#B91C1C;
    --brass:#5B6B82;
    --green:#16A34A;
    --amber:#D97706;
    --line:#E1E4EA;
    --primary:#1E2F4E;
    --primary-2:#2F4874;
    --primary-soft:#E8ECF3;
    --sidebar-bg:#11161F;
    --sidebar-bg-2:#161D29;
    --sidebar-ink:#AEB8C6;
    --sidebar-ink-dim:#6E7A8C;
    --sidebar-active:#1E2F4E;
  }
  *{box-sizing:border-box;}
  #app-root{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
  }
  .mono{font-family:ui-monospace,'SF Mono','Cascadia Mono','Courier New',monospace;}
  .head-font{font-family:'Inter',-apple-system,sans-serif;font-weight:800;letter-spacing:-.01em;}

  .topbar{
    background:#fff;
    color:var(--ink);
    padding:22px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{width:38px;height:38px;flex-shrink:0;}
  .brand-logo{width:44px;height:44px;flex-shrink:0;object-fit:contain;border-radius:8px;}
  .brand h1{font-size:21px;text-transform:uppercase;margin:0;letter-spacing:.04em;color:var(--ink);}
  .brand span{
    display:block;font-size:11px;color:var(--primary);
    letter-spacing:.1em;text-transform:uppercase;margin-top:2px;
    font-weight:600;
  }
  .stats{display:flex;gap:24px;}
  .stat{text-align:right;}
  .stat-critical{background:#FBE9E9!important;border-color:#F3B6B6!important;}
  .stat b{display:block;font-size:24px;font-family:'Inter',sans-serif;font-weight:700;}
  .stat small{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#6B7280;}

  .user-box{display:flex;align-items:center;gap:10px;}
  .user-email{font-size:12px;color:#6B7280;}
  .user-box .btn-ghost{
    background:transparent;border:1px solid var(--line);color:var(--ink);
    padding:7px 14px;font-size:12px;border-radius:8px;cursor:pointer;
  }
  .user-box .btn-ghost:hover{background:var(--paper);}

  .user-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap;
  }
  .user-row:last-child{border-bottom:none;}
  .user-row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .user-row-actions button{
    padding:6px 10px;border:1px solid var(--line);border-radius:2px;background:#fff;
    font-size:11px;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:.03em;
  }
  .user-row-actions button:hover{background:var(--paper);}
  .user-row-actions button.danger{color:var(--red);border-color:var(--red);}

  .toolbar{
    padding:20px 28px 0;
    display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;
  }
  .filters{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    padding:6px 14px;border-radius:2px;border:1px solid var(--line);
    background:transparent;font-size:12px;cursor:pointer;
    text-transform:uppercase;letter-spacing:.05em;font-weight:600;
    color:var(--ink);opacity:.6;
  }
  .chip.active{opacity:1;background:var(--primary);color:#fff;border-color:var(--primary);}
  .search{
    padding:8px 12px;border:1px solid var(--line);border-radius:2px;
    background:#fff;font-size:13px;min-width:220px;
  }
  .btn-primary{
    background:var(--primary);color:#fff;border:none;padding:8px 16px;
    border-radius:2px;font-weight:700;cursor:pointer;font-size:12px;
    text-transform:uppercase;letter-spacing:.05em;
  }
  .btn-primary:hover{background:var(--primary-2);}

  .content{padding:20px 28px 60px;}
  .empty{text-align:center;padding:60px 20px;color:#6B7280;}
  .empty svg{width:70px;height:70px;opacity:.4;margin-bottom:14px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
  .card{
    background:#fff;border:1px solid var(--line);border-radius:3px;
    position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .card .tag-strip{
    background:var(--tag);padding:10px 16px;display:flex;justify-content:space-between;
    align-items:center;border-bottom:1px solid var(--line);
  }
  .card .badge{
    font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
    padding:3px 9px;border-radius:12px;color:#fff;
  }
  .b-recibido{background:var(--amber);}
  .b-proceso{background:var(--primary);}
  .b-listo{background:var(--green);}
  .b-entregado{background:#6B7280;}
  .venc-vencido{color:var(--red)!important;font-weight:700;}
  .venc-proximo{color:var(--amber)!important;font-weight:700;}
  .pay-badge{
    font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    padding:2px 7px;border-radius:10px;color:#fff;margin-left:6px;
  }
  .pay-ok{background:var(--green);}
  .pay-pend{background:var(--red);}

  .card-body{padding:16px;}
  .card-body h3{margin:0 0 2px;font-size:17px;font-family:'Inter',-apple-system,sans-serif;font-weight:700;}
  .card-body .sub{font-size:12px;color:#6B7280;margin-bottom:12px;}
  .meta-row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid #EEF0F2;}
  .meta-row:last-child{border-bottom:none;}
  .meta-row .k{color:#6B7280;text-transform:uppercase;letter-spacing:.04em;font-size:10.5px;}
  .meta-row .v{font-weight:600;text-align:right;}
  .meta-row .v.mono{font-weight:500;letter-spacing:.02em;color:#6b6455;font-size:11.5px;}
  .meta-row .v.mono.venc-vencido,.meta-row .v.mono.venc-proximo{font-weight:700;color:inherit;}

  .card-actions{display:flex;border-top:1px solid var(--line);flex-wrap:wrap;}
  .card-actions button{
    flex:1;padding:7px 4px;border:none;background:transparent;cursor:pointer;
    font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    color:var(--ink);border-right:1px solid var(--line);
    text-align:center;text-decoration:none;display:block;
    min-width:56px;
  }
  .card-actions button:last-child{border-right:none;}
  .card-actions button:hover{background:var(--paper);}
  .card-actions button.danger{color:var(--red);}

  .overlay{
    position:fixed;inset:0;background:rgba(28,31,30,.55);
    display:flex;align-items:flex-start;justify-content:center;
    padding:40px 16px;overflow-y:auto;z-index:50;
  }
  .modal{
    background:var(--paper);border-radius:4px;max-width:560px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .modal-head{
    background:var(--primary);color:#fff;padding:18px 24px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .modal-head h2{margin:0;font-size:18px;font-family:'Inter',-apple-system,sans-serif;font-weight:700;text-transform:uppercase;}
  .modal-head button{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;}
  .modal-body{padding:22px 24px;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
  .form-row.linea-cant-precio{grid-template-columns:0.8fr 1fr 1fr;}
  .form-row.linea-cant-precio input:disabled{background:var(--paper);color:var(--ink);font-weight:700;border-color:var(--line);}
  .form-row.full{grid-template-columns:1fr;}
  label{
    display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
    color:#6B7280;margin-bottom:4px;font-weight:700;
  }
  input,select,textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:2px;
    font-size:13px;font-family:inherit;background:#fff;color:var(--ink);
  }
  textarea{resize:vertical;min-height:60px;}
  .service-checks{
    display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;
    background:#fff;border:1px solid var(--line);border-radius:2px;padding:10px 12px;
  }
  .service-check{
    display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;
    text-transform:none;letter-spacing:0;cursor:pointer;
  }
  .service-check input{width:auto;margin:0;}
  .servicio-icon{width:15px;height:15px;flex-shrink:0;color:var(--brass);}
  .servicio-icon svg{width:100%;height:100%;display:block;}
  .service-checks-priced{grid-template-columns:1fr 1fr;gap:2px 16px;}
  .service-group-title{
    grid-column:1/-1;font-size:10px;text-transform:uppercase;letter-spacing:.07em;
    color:#6B7280;font-weight:800;margin:10px 0 3px;padding-top:6px;border-top:1px solid var(--line);
  }
  .service-check-priced{justify-content:space-between;padding:3px 0;}
  .service-check-priced span{flex:1;}
  .servicio-precio-input{
    width:90px !important;flex-shrink:0;padding:4px 6px !important;font-size:12px !important;
    border:1px solid var(--line);border-radius:2px;
  }
  .detalle-vs-total{
    font-size:12px;padding:8px 12px;border-radius:2px;margin:8px 0 14px;font-weight:600;
  }
  .detalle-vs-total.ok{background:#eaf3ec;color:#1e4d2b;}
  .detalle-vs-total.diff{background:#fbeceb;color:#7a231d;}
  .modal-foot{padding:16px 24px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);flex-wrap:wrap;}
  .btn-ghost{background:transparent;border:1px solid var(--line);padding:7px 14px;border-radius:2px;cursor:pointer;font-size:12px;font-weight:600;}
  .toast{
    position:fixed;bottom:24px;right:24px;background:var(--ink);color:var(--paper);
    padding:12px 20px;border-radius:3px;font-size:13px;z-index:100;
    box-shadow:0 8px 24px rgba(0,0,0,.3);
  }
  .loading{padding:60px;text-align:center;color:#6B7280;}
  .field-err{border-color:var(--red) !important;}
  .field-hint{display:block;font-size:10px;color:#6B7280;margin-top:3px;font-weight:500;text-transform:none;}
  .error-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .error-box{
    max-width:420px;text-align:center;background:#fff;border:1px solid var(--line);
    border-radius:4px;padding:32px 28px;
  }
  .error-box h2{font-family:'Inter',-apple-system,sans-serif;font-weight:700;font-size:19px;margin:0 0 10px;color:var(--primary);}
  .error-box p{font-size:13px;color:#6B7280;line-height:1.5;margin-bottom:20px;}
  .storage-warning{
    background:#f4d35e;color:#3a2f00;padding:8px 28px;font-size:12.5px;font-weight:600;
    text-align:center;
  }
  .storage-warning-info{
    background:#d8e6dc;color:#264d33;
  }

  /* ---- Panel de control (dashboard) ---- */
  .view-toggle{display:flex;gap:0;border:1px solid var(--line);border-radius:2px;overflow:hidden;}
  .view-toggle button{
    padding:8px 16px;border:none;background:#fff;cursor:pointer;font-size:12px;font-weight:700;
    text-transform:uppercase;letter-spacing:.05em;color:var(--ink);opacity:.55;
  }
  .view-toggle button + button{border-left:1px solid var(--line);}
  .view-toggle button.active{opacity:1;background:var(--primary);color:#fff;}

  .dash-toolbar{
    padding:20px 28px 0;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;
  }
  .dash-content{padding:20px 28px 60px;}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:22px;}
  .kpi-card{
    background:#fff;border:1px solid var(--line);border-radius:3px;padding:16px 18px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative;overflow:hidden;
  }
  .kpi-card:before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brass);
  }
  .kpi-card.kpi-red:before{background:var(--red);}
  .kpi-card.kpi-green:before{background:var(--green);}
  .kpi-card.kpi-amber:before{background:var(--amber);}
  .kpi-card.kpi-critical{
    box-shadow:0 6px 20px rgba(179,38,30,.16), 0 1px 3px rgba(179,38,30,.12);
    border-color:rgba(179,38,30,.3);
  }
  .kpi-card.kpi-critical .kpi-value{color:var(--red);font-size:32px;}
  .kpi-card.kpi-critical .kpi-label{color:var(--red-dark);}
  .kpi-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#6B7280;font-weight:700;margin-bottom:6px;}
  .kpi-value{font-family:'Inter',-apple-system,sans-serif;font-weight:700;font-size:28px;font-weight:700;color:var(--ink);transition:color .2s,font-size .2s;}
  .kpi-sub{font-size:11px;color:#6B7280;margin-top:4px;}

  .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:18px;}
  .dash-panel{
    background:#fff;border:1px solid var(--line);border-radius:3px;padding:18px 20px 20px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .dash-panel.full{grid-column:1/-1;}
  .dash-panel h3{
    margin:0 0 14px;font-size:14px;font-family:'Inter',-apple-system,sans-serif;font-weight:700;text-transform:uppercase;
    letter-spacing:.04em;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline;
  }
  .dash-panel h3 span{font-size:10.5px;color:#6B7280;text-transform:none;letter-spacing:0;font-weight:500;font-family:-apple-system,sans-serif;}
  .bar-row{display:flex;align-items:center;gap:10px;padding:5px 0;}
  .bar-label{width:150px;flex-shrink:0;font-size:12px;color:var(--ink);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-track{flex:1;background:var(--paper);border-radius:2px;height:18px;overflow:hidden;position:relative;}
  .bar-fill{height:100%;background:var(--brass);border-radius:2px;transition:width .3s;}
  .bar-fill.c-red{background:var(--red);}
  .bar-fill.c-green{background:var(--green);}
  .bar-fill.c-amber{background:var(--amber);}
  .bar-fill.c-ink{background:var(--ink);}
  .bar-value{width:56px;flex-shrink:0;font-size:12px;font-weight:700;font-family:'Courier New',monospace;}
  .dash-empty{text-align:center;padding:30px 10px;color:#6B7280;font-size:13px;}

  .month-chart{display:flex;align-items:flex-end;gap:8px;height:170px;padding:6px 4px 0;}
  .month-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
  .month-bar{width:100%;max-width:38px;background:var(--red);border-radius:2px 2px 0 0;min-height:2px;transition:height .3s;}
  .month-bar-label{font-size:10px;color:#6B7280;text-transform:uppercase;text-align:center;line-height:1.2;}
  .month-bar-value{font-size:10.5px;font-weight:700;font-family:'Courier New',monospace;color:var(--ink);}

  .vence-list{max-height:260px;overflow-y:auto;}
  .vence-item{
    display:flex;justify-content:space-between;align-items:center;padding:8px 0;
    border-bottom:1px solid #EEF0F2;font-size:12.5px;gap:10px;
  }
  .vence-item:last-child{border-bottom:none;}
  .vence-item .v-name{font-weight:600;}
  .vence-item .v-order{color:#6B7280;font-size:11px;}
  .vence-item .v-date{font-family:'Courier New',monospace;font-weight:700;white-space:nowrap;}

  @media (max-width:640px){
    .bar-label{width:90px;font-size:11px;}
  }

  /* ---- Clientes ---- */
  .clientes-toolbar{padding:20px 28px 0;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
  .clientes-content{padding:20px 28px 60px;}
  .clientes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
  .cliente-card{
    background:#fff;border:1px solid var(--line);border-radius:3px;padding:16px 18px;cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.06);transition:box-shadow .15s;
  }
  .cliente-card:hover{box-shadow:0 3px 10px rgba(0,0,0,.1);}
  .cliente-card h3{margin:0 0 4px;font-size:16px;font-family:'Inter',-apple-system,sans-serif;font-weight:700;}
  .cliente-card .sub{font-size:12px;color:#6B7280;margin-bottom:12px;}
  .cliente-stats{display:flex;gap:16px;}
  .cliente-stat b{display:block;font-size:19px;font-family:'Inter',-apple-system,sans-serif;font-weight:700;}
  .cliente-stat small{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#6B7280;}

  .cliente-detail-head{
    display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;
    background:#fff;border:1px solid var(--line);border-radius:3px;padding:20px 22px;margin-bottom:18px;
  }
  .cliente-detail-head h2{margin:0 0 4px;font-size:20px;font-family:'Inter',-apple-system,sans-serif;font-weight:700;}
  .cliente-detail-head .sub{font-size:13px;color:#6B7280;}
  .cliente-kpis{display:flex;gap:22px;flex-wrap:wrap;}
  .cliente-kpi b{display:block;font-size:22px;font-family:'Inter',-apple-system,sans-serif;font-weight:700;}
  .cliente-kpi small{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#6B7280;}
  .back-link{
    background:transparent;border:1px solid var(--line);padding:7px 14px;border-radius:2px;
    font-size:12px;font-weight:600;cursor:pointer;margin-bottom:14px;
  }
  .back-link:hover{background:#fff;}

  /* ---- Líneas de extintores en el formulario ---- */
  .linea-extintor{
    border:1px solid var(--line);border-radius:3px;padding:14px 16px;margin-bottom:12px;background:#F9FAFB;position:relative;
  }
  .linea-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .linea-head b{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#6B7280;}
  .linea-remove{background:none;border:none;color:var(--red);font-size:12px;font-weight:700;cursor:pointer;padding:2px 6px;}
  .linea-remove:disabled{opacity:.3;cursor:not-allowed;}
  .btn-add-linea{
    width:100%;padding:10px;border:1.5px dashed var(--line);background:transparent;border-radius:3px;
    font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;margin-bottom:14px;
  }
  .btn-add-linea:hover{background:#fff;border-color:var(--brass);}
  .of-totales-preview{
    background:var(--paper);border:1px solid var(--line);border-radius:8px;
    padding:10px 14px;margin-bottom:14px;
  }
  .of-totales-row{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:#4B5563;}
  .of-totales-row.of-desc b{color:var(--red);}
  .of-totales-row.of-total{
    border-top:1px solid var(--line);margin-top:4px;padding-top:7px;
    font-size:14.5px;font-weight:800;color:var(--ink);
  }

  /* ---- Tarjeta de orden agrupada (varios extintores) ---- */
  .order-card{
    background:#fff;border:1px solid var(--line);border-radius:3px;overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .order-card .order-head{
    padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;
  }
  .order-card .order-head h3{margin:0;font-size:15px;font-family:'Inter',-apple-system,sans-serif;font-weight:700;}
  .order-card .order-head .sub{font-size:11px;color:#6B7280;}
  .order-item{border-bottom:1px solid #EEF0F2;}
  .order-item:last-child{border-bottom:none;}
  .order-item-body{padding:16px 18px 18px;}
  .order-item .tag-strip{padding:8px 16px 0;}
  .order-item > summary{padding-top:12px;padding-bottom:12px;}

  /* ---- Tarjetas colapsables (compactas hasta que se tocan) ---- */
  .card, .order-card{ padding:0; }
  details.card-collapse{
    background:#fff;border:1px solid var(--line);border-radius:3px;overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  details.card-collapse > summary{
    list-style:none;cursor:pointer;padding:12px 16px;display:flex;justify-content:space-between;
    align-items:center;gap:10px;
  }
  details.card-collapse > summary::-webkit-details-marker{display:none;}
  details.card-collapse > summary::after{
    content:'▾';font-size:11px;color:#6B7280;flex-shrink:0;transition:transform .15s;
  }
  details.card-collapse[open] > summary::after{transform:rotate(180deg);}
  .summary-main{min-width:0;flex:1;}
  .summary-main h3{margin:0 0 2px;font-size:14.5px;font-family:'Inter',-apple-system,sans-serif;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .summary-main .sub-line{font-size:11px;color:#6B7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .summary-side{flex-shrink:0;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
  .summary-price{font-size:13px;font-weight:700;font-family:'Courier New',monospace;}
  details.card-collapse .card-inner-body{border-top:1px solid var(--line);}

  /* ---- Caja diaria ---- */
  .caja-content{padding:20px 28px 60px;max-width:820px;}
  .caja-card{
    background:#fff;border:1px solid var(--line);border-radius:3px;padding:20px 22px;margin-bottom:18px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .caja-card h3{margin:0 0 14px;font-size:15px;font-family:'Inter',-apple-system,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .caja-open-form{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;}
  .caja-open-form label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#6B7280;margin-bottom:5px;font-weight:700;}
  .caja-open-form input{padding:9px 10px;border:1px solid var(--line);border-radius:2px;font-size:14px;width:160px;}
  .caja-kpis{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:6px;}
  .caja-kpi b{display:block;font-size:22px;font-family:'Inter',-apple-system,sans-serif;font-weight:700;}
  .caja-kpi small{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#6B7280;}
  .mov-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
  .mov-form > div{flex:1;min-width:120px;}
  .mov-form label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#6B7280;margin-bottom:5px;font-weight:700;}
  .mov-form input, .mov-form select{padding:9px 10px;border:1px solid var(--line);border-radius:2px;font-size:13px;width:100%;}
  .mov-list{border-top:1px solid var(--line);}
  .mov-row{
    display:flex;justify-content:space-between;align-items:center;padding:9px 0;
    border-bottom:1px solid #EEF0F2;font-size:13px;gap:10px;
  }
  .mov-row:last-child{border-bottom:none;}
  .mov-row .m-concepto{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mov-row .m-hora{font-size:10.5px;color:#6B7280;font-family:'Courier New',monospace;}
  .mov-row .m-monto{font-family:'Courier New',monospace;font-weight:700;white-space:nowrap;}
  .mov-row .m-monto.entrada{color:var(--green);}
  .mov-row .m-monto.salida{color:var(--red);}
  .mov-row .m-del{background:none;border:none;color:var(--red);cursor:pointer;font-size:11px;font-weight:700;flex-shrink:0;}
  .caja-empty{text-align:center;padding:20px 10px;color:#6B7280;font-size:13px;}
  .cierre-diff{
    margin-top:14px;padding:12px 16px;border-radius:3px;border:1.5px solid;
  }
  .cierre-diff.ok{border-color:var(--green);background:#eaf3ec;color:#1e4d2b;}
  .cierre-diff.bad{border-color:var(--red);background:#fbeceb;color:#7a231d;}
  .caja-history-item{
    display:flex;justify-content:space-between;align-items:center;padding:10px 0;
    border-bottom:1px solid #EEF0F2;font-size:13px;
  }
  .caja-history-item:last-child{border-bottom:none;}

  /* ---- Papelera ---- */
  .papelera-item{
    display:flex;justify-content:space-between;align-items:center;padding:12px 0;
    border-bottom:1px solid #EEF0F2;gap:12px;
  }
  .papelera-item:last-child{border-bottom:none;}
  .papelera-info{min-width:0;flex:1;}
  .papelera-info .p-title{font-weight:700;font-size:13.5px;}
  .papelera-info .p-sub{font-size:11.5px;color:#6B7280;margin-top:2px;}
  .papelera-actions{display:flex;gap:8px;flex-shrink:0;}
  .papelera-actions button{
    padding:6px 12px;border-radius:2px;font-size:11.5px;font-weight:700;cursor:pointer;border:1px solid var(--line);
    background:#fff;
  }
  .papelera-actions button.restaurar{color:var(--green);border-color:var(--green);}
  .papelera-actions button.eliminar{color:var(--red);border-color:var(--red);}
  .papelera-pendiente{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;
    color:var(--amber);border:1px dashed var(--amber);border-radius:2px;padding:6px 10px;
    white-space:nowrap;
  }
  .caja-hint{font-size:11.5px;color:#6B7280;margin:8px 0 14px;font-style:italic;}
  .caja-subtitle{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#6B7280;font-weight:700;margin-bottom:8px;}
  .metodo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px;}
  .metodo-item{
    background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:8px 12px;
    display:flex;flex-direction:column;gap:2px;
  }
  .metodo-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#6B7280;font-weight:700;}
  .metodo-monto{font-family:'Courier New',monospace;font-weight:700;font-size:15px;}
  .m-metodo-tag{
    font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:#6B7280;
    border:1px solid var(--line);border-radius:2px;padding:1px 6px;flex-shrink:0;
  }

  /* ---- CRM: Embudo de ventas (pipeline) ---- */
  .pipeline-toolbar{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;
  }
  .pipeline-board{
    display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start;
  }
  .pipeline-col{background:#F9FAFB;border:1px solid var(--line);border-radius:3px;overflow:hidden;}
  .pipeline-col-head{
    padding:10px 12px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
    display:flex;justify-content:space-between;align-items:center;color:#fff;
  }
  .pipeline-col-count{font-size:10.5px;font-weight:600;text-transform:none;letter-spacing:0;opacity:.9;}
  .etapa-badge{
    font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    padding:3px 9px;border-radius:12px;color:#fff;flex-shrink:0;
  }
  .etiqueta-badge{
    font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    padding:2px 8px;border-radius:10px;color:#fff;margin-right:4px;display:inline-block;margin-bottom:3px;
  }
  .etiqueta-vip{background:var(--amber);}
  .etiqueta-corporativo{background:var(--brass);}
  .etiqueta-residencial{background:var(--green);}
  .etiqueta-moroso{background:var(--red);}
  .etiqueta-membresia{background:var(--primary);}
  .etapa-contactado{background:var(--brass);}
  .etapa-cotizado{background:var(--amber);}
  .etapa-ganado{background:var(--green);}
  .etapa-perdido{background:#6B7280;}
  .pipeline-col-body{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:60px;}
  .pipeline-empty{font-size:11.5px;color:#6B7280;text-align:center;padding:14px 4px;}
  .oportunidad-card{
    background:#fff;border:1px solid var(--line);border-radius:3px;padding:10px 12px;cursor:grab;
    box-shadow:0 1px 3px rgba(0,0,0,.06);transition:box-shadow .15s,transform .15s;
  }
  .oportunidad-card:hover{box-shadow:0 3px 10px rgba(0,0,0,.1);transform:translateY(-1px);}
  .oportunidad-card:active{cursor:grabbing;}
  .oc-cliente{font-weight:700;font-size:13px;margin-bottom:3px;}
  .oc-desc{font-size:11.5px;color:#6b6455;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .oc-foot{display:flex;justify-content:space-between;align-items:center;}
  .oc-monto{font-size:12px;font-weight:700;font-family:'Courier New',monospace;color:var(--ink);}
  .oc-fecha{font-size:10px;color:#6B7280;}
  @media (max-width:900px){ .pipeline-board{grid-template-columns:1fr 1fr;} }
  @media (max-width:560px){ .pipeline-board{grid-template-columns:1fr;} }

  /* ---- CRM: Recordatorios ---- */
  .recordatorio-row{
    display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #EEF0F2;
  }
  .recordatorio-row:last-child{border-bottom:none;}
  .recordatorio-row input[type=checkbox]{width:16px;height:16px;flex-shrink:0;}
  .rec-body{flex:1;min-width:0;}
  .rec-texto{font-size:13px;font-weight:600;}
  .rec-sub{font-size:11px;color:#6B7280;margin-top:2px;}
  .rec-del{background:none;border:none;color:var(--red);cursor:pointer;font-size:11px;font-weight:700;flex-shrink:0;}
  .rec-completado .rec-texto{text-decoration:line-through;color:#6B7280;}

/* =========================================================
     V2 — Capa visual moderna
     Mantiene la paleta original y mejora UX/UI.
     ========================================================= */
  :root{
    --radius:10px;
    --radius-sm:7px;
    --shadow-sm:0 2px 8px rgba(28,31,30,.06);
    --shadow-md:0 8px 24px rgba(28,31,30,.10);
    --shadow-lg:0 18px 50px rgba(28,31,30,.18);
  }

  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--paper);}
  @keyframes viewFadeIn{ from{opacity:0;transform:translateY(4px);} to{opacity:1;transform:translateY(0);} }
  .view-fade{animation:viewFadeIn .22s ease-out;}
  @media (prefers-reduced-motion:reduce){ .view-fade{animation:none;} }
  button,input,select,textarea{transition:border-color .15s,box-shadow .15s,background .15s,transform .12s;}
  button:active{transform:translateY(1px);}

  .screen-view{min-height:100vh;}
  .topbar{
    position:sticky;top:0;z-index:30;
    padding:15px 28px;
    box-shadow:0 1px 0 rgba(0,0,0,.03);
  }
  .brand{gap:12px;}
  .brand-logo{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);}
  .brand h1{font-size:20px;line-height:1.05;}
  .brand span{font-size:10px;}

  .stats{gap:8px;align-items:stretch;}
  .stat{
    min-width:74px;text-align:center;padding:7px 10px;
    border:1px solid var(--line);border-radius:10px;background:var(--paper);
  }
  .stat b{font-size:20px;line-height:1.05;color:var(--ink);}
  .stat small{font-size:9px;}

  .user-box{gap:7px;}
  .user-email{
    max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .user-box .btn-ghost{
    border-radius:8px;padding:8px 11px;
  }
  .user-box .btn-ghost:hover{background:var(--paper);}

  .dash-toolbar{
    position:sticky;top:76px;z-index:20;
    padding:13px 28px;
    background:rgba(246,247,249,.94);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .view-toggle{border-radius:8px;background:#fff;box-shadow:var(--shadow-sm);}
  .view-toggle button{padding:9px 15px;}
  .view-toggle button.active{background:var(--primary);}

  .toolbar,.clientes-toolbar{padding-left:28px;padding-right:28px;}
  .toolbar{gap:10px;}
  .filters{gap:6px;}
  .chip{
    border-radius:999px;padding:7px 13px;
    background:#fff;box-shadow:var(--shadow-sm);
  }
  .chip:hover{opacity:1;background:#fff;}
  .chip.active{box-shadow:none;}

  .search{
    min-width:250px;border-radius:8px;padding:10px 12px;
    box-shadow:var(--shadow-sm);
  }
  .search:focus,input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--brass);
    box-shadow:0 0 0 3px rgba(139,129,104,.15);
  }

  .btn-primary,.btn-ghost{
    border-radius:8px;
    min-height:38px;
  }
  .btn-primary{padding:9px 15px;box-shadow:0 2px 5px rgba(30,47,78,.25);}
  .btn-primary:hover{transform:translateY(-1px);}
  .btn-ghost{background:#fff;}
  .btn-ghost:hover{background:#fff;box-shadow:var(--shadow-sm);}

  .content,.dash-content,.clientes-content{padding-top:18px;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:15px;}

  details.card-collapse,.order-card,.cliente-card,.dash-panel,.kpi-card,.caja-card,.cliente-detail-head{
    border-radius:var(--radius);
    box-shadow:var(--shadow-sm);
  }
  details.card-collapse{
    border-color:#E5E7EB;
    transition:box-shadow .18s,transform .18s,border-color .18s;
  }
  details.card-collapse:hover{
    box-shadow:var(--shadow-md);
    border-color:#D1D5DB;
  }
  details.card-collapse[open]{box-shadow:var(--shadow-md);}

  details.card-collapse > summary{padding:14px 16px;min-height:67px;}
  details.card-collapse > summary::after{font-size:13px;}
  .summary-main h3{font-size:15px;}
  .summary-main .sub-line{margin-top:3px;}
  .summary-side{gap:5px;}
  .summary-price{font-size:14px;}

  .badge{box-shadow:0 1px 2px rgba(0,0,0,.10);}
  .card-inner-body{background:#fff;}
  .card-body{padding:15px 17px;}
  .meta-row{padding:7px 0;}
  .card-actions{background:#F9FAFB;}
  .card-actions button{
    min-height:39px;padding:8px 5px;
  }
  .card-actions button:hover{background:#f2ede0;}

  .dash-content{max-width:1450px;margin:0 auto;}
  .kpi-grid{gap:13px;}
  .kpi-card{padding:17px 18px;border-color:#E5E7EB;}
  .kpi-value{font-size:30px;}
  .kpi-card:before{width:5px;}

  .dash-grid{gap:15px;}
  .dash-panel{border-color:#E5E7EB;}
  .dash-panel h3{font-size:15px;}
  .bar-track{border-radius:999px;height:16px;}
  .bar-fill{border-radius:999px;}
  .month-chart{height:190px;}
  .month-bar{border-radius:6px 6px 2px 2px;}

  .cliente-card{
    border-color:#E5E7EB;
    transition:transform .16s,box-shadow .16s,border-color .16s;
  }
  .cliente-card:hover{transform:translateY(-2px);border-color:#D1D5DB;}
  .cliente-stat b{font-size:20px;}

  .modal{
    max-width:720px;
    border-radius:12px;
    overflow:hidden;
    box-shadow:var(--shadow-lg);
  }
  .modal-head{padding:17px 22px;}
  .modal-body{padding:20px 22px;max-height:70vh;overflow:auto;}
  .modal-foot{padding:14px 22px;background:#F9FAFB;}
  .modal-head button{
    width:34px;height:34px;border-radius:7px;
  }
  .modal-head button:hover{background:#303332;}
  .linea-extintor{
    border-radius:9px;
    border-color:#E5E7EB;
    box-shadow:inset 3px 0 0 var(--brass);
  }
  .btn-add-linea{border-radius:8px;}

  .caja-content{max-width:1050px;}
  .caja-card{border-color:#E5E7EB;}
  .mov-row{padding:11px 0;}
  .m-metodo-tag{border-radius:999px;background:#fff;}
  .cierre-diff{border-radius:9px;}

  .storage-warning{
    position:sticky;top:0;z-index:35;
    padding:9px 20px;
  }

  .empty{
    background:rgba(255,255,255,.55);
    border:1px dashed var(--line);
    border-radius:12px;
  }

  /* Barra de acciones rápidas */
  .quick-actions{
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;
    margin:-5px 0 17px;
    padding:12px 14px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow-sm);
  }
  .quick-actions .quick-title{
    margin-right:auto;font-size:10px;font-weight:800;
    text-transform:uppercase;letter-spacing:.08em;color:#6B7280;
  }
  .quick-actions button{min-height:34px;}

  /* Mejor lectura del detalle de órdenes */
  .order-item > summary{
    background:#fff;
    transition:background .15s;
  }
  .order-item > summary:hover{background:#F9FAFB;}
  .order-item-body{background:#fff;}
  .order-card .card-actions{background:#F9FAFB;}

  @media (max-width:900px){
    .topbar{position:relative;padding:14px 18px;}
    .dash-toolbar{position:relative;top:auto;padding:10px 18px;}
    .storage-warning{position:relative;top:auto;}
    .topbar{align-items:flex-start;}
    .stats{width:100%;overflow-x:auto;padding-bottom:2px;}
    .stat{flex:1;min-width:72px;}
    .user-box{width:100%;flex-wrap:wrap;}
    .user-email{flex:1;min-width:120px;}
    .toolbar,.clientes-toolbar{padding-left:18px;padding-right:18px;}
    .content,.dash-content,.clientes-content{padding-left:18px;padding-right:18px;}
    .dash-grid{grid-template-columns:1fr;}
    .dash-panel.full{grid-column:auto;}
  }

  @media (max-width:640px){
    .brand h1{font-size:17px;}
    .brand-logo{width:40px;height:40px;}
    .view-toggle{width:100%;overflow-x:auto;}
    .view-toggle button{flex:1;min-width:90px;padding:9px 8px;font-size:10px;}
    .toolbar{align-items:stretch;}
    .toolbar > div:last-child{width:100%;}
    .toolbar .search{width:100%;min-width:0;}
    .toolbar .btn-ghost,.toolbar .btn-primary{flex:1;}
    .grid{grid-template-columns:1fr;}
    .form-row{grid-template-columns:1fr;}
    .form-row.linea-cant-precio{grid-template-columns:1fr 1fr;}
    .service-checks{grid-template-columns:1fr;}
    .service-checks-priced{grid-template-columns:1fr;}
    .modal-body{padding:16px;max-height:72vh;}
    .modal-foot{padding:12px 16px;}
    .modal-foot button{flex:1;}
    .kpi-grid{grid-template-columns:1fr 1fr;}
    .kpi-value{font-size:23px;}
    .kpi-sub{font-size:10px;}
    .dash-grid{grid-template-columns:1fr;}
    .bar-label{width:105px;}
    .caja-content{padding-left:18px;padding-right:18px;}
    .mov-row{display:grid;grid-template-columns:auto auto 1fr auto;gap:6px;}
    .mov-row .m-hora{grid-column:1;}
    .mov-row .m-metodo-tag{grid-column:2;}
    .mov-row .m-concepto{grid-column:3;}
    .mov-row .m-monto{grid-column:4;}
    .mov-row .m-del{grid-column:4;justify-self:end;}
    .quick-actions .quick-title{width:100%;margin-bottom:2px;}
  }

  @media (max-width:420px){
    .topbar{padding:12px;}
    .content,.dash-content,.clientes-content,.toolbar,.clientes-toolbar{padding-left:12px;padding-right:12px;}
    .kpi-grid{grid-template-columns:1fr;}
    .stat{min-width:68px;padding:6px 7px;}
    .stat b{font-size:18px;}
    .user-box .btn-ghost{flex:1;}
  }



/* =========================================================
   V3 — CRM INDUSTRIAL | Extintores Seguridad
   Tablero operativo, mantenimiento, activos, ventas y control.
   ========================================================= */
.crm-industrial{
  max-width:1500px;margin:0 auto;padding:24px 28px 70px;
}
.crm-hero{
  display:flex;justify-content:space-between;align-items:flex-start;gap:20px;
  padding:24px;background:linear-gradient(135deg,#fff 0%,#f8fafc 100%);
  border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);
  margin-bottom:18px;
}
.crm-hero h2{margin:0 0 5px;font-size:26px;letter-spacing:-.03em}
.crm-hero p{margin:0;color:#6B7280;font-size:13px}
.crm-hero-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.crm-section-title{
  display:flex;justify-content:space-between;align-items:end;gap:12px;margin:24px 0 10px;
}
.crm-section-title h3{margin:0;font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.crm-section-title span{font-size:11px;color:#6B7280}
.crm-kpis-industrial{
  display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:12px;
}
.crm-kpi{
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px;
  box-shadow:var(--shadow-sm);cursor:pointer;transition:.16s;
}
.crm-kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.crm-kpi .icon{font-size:18px;margin-bottom:10px}
.crm-kpi .value{font-size:27px;font-weight:800;letter-spacing:-.03em}
.crm-kpi .label{font-size:10px;color:#6B7280;text-transform:uppercase;letter-spacing:.07em;margin-top:4px;font-weight:700}
.crm-kpi .hint{font-size:10.5px;color:#6B7280;margin-top:8px}
.crm-kpi.critical{border-color:#f3b6b6;background:#fff8f8}
.crm-kpi.critical .value{color:var(--red)}
.crm-industrial-grid{
  display:grid;grid-template-columns:1.25fr .9fr .9fr;gap:15px;
}
.crm-panel{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;
  box-shadow:var(--shadow-sm);min-width:0;
}
.crm-panel.full{grid-column:1/-1}
.crm-panel h4{margin:0 0 14px;font-size:14px}
.crm-list{display:flex;flex-direction:column}
.crm-list-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 0;border-bottom:1px solid #EEF0F2;font-size:12px;
}
.crm-list-row:last-child{border-bottom:none}
.crm-list-main{min-width:0;flex:1}
.crm-list-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crm-list-main span{display:block;color:#6B7280;font-size:10.5px;margin-top:2px}
.crm-list-value{font-family:'Courier New',monospace;font-weight:700;white-space:nowrap}
.crm-pill{
  display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;
  font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  background:#f1f5f9;color:#475569;
}
.crm-pill.red{background:#fbe9e9;color:#b91c1c}
.crm-pill.amber{background:#fff4df;color:#a15c00}
.crm-pill.green{background:#eaf7ee;color:#166534}
.crm-actions-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.crm-action{
  display:flex;align-items:center;gap:9px;padding:11px 12px;border:1px solid var(--line);
  background:#fff;border-radius:10px;cursor:pointer;text-align:left;font-weight:700;font-size:11px;
}
.crm-action:hover{background:#F8FAFC;border-color:#CBD5E1}
.crm-action small{display:block;color:#6B7280;font-weight:500;margin-top:2px}
.crm-progress{height:8px;background:#EEF2F7;border-radius:999px;overflow:hidden;margin-top:7px}
.crm-progress i{display:block;height:100%;border-radius:999px;background:var(--red)}
.crm-mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.crm-mini{
  padding:12px;border:1px solid var(--line);border-radius:10px;background:#F9FAFB
}
.crm-mini b{display:block;font-size:20px}
.crm-mini span{font-size:9.5px;color:#6B7280;text-transform:uppercase;letter-spacing:.05em}
.crm-nav-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:7px}
.link-btn{
  background:none;border:none;padding:0;margin-left:6px;color:var(--primary);
  font-size:11px;font-weight:600;text-decoration:underline;cursor:pointer;font-family:inherit;
}
.link-btn:hover{color:var(--primary-2);}
@media(max-width:1200px){.crm-kpis-industrial{grid-template-columns:repeat(3,1fr)}.crm-industrial-grid{grid-template-columns:1fr 1fr}.crm-panel.full{grid-column:1/-1}}

/* =========================================================
   V4 — Shell tipo CRM (barra lateral + cabecera)
   ========================================================= */
.app-shell{display:flex;align-items:stretch;min-height:100vh;}
.sidebar{
  width:236px;flex-shrink:0;background:var(--sidebar-bg);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  border-right:1px solid #05070B;
}
.sidebar-brand{
  display:flex;align-items:center;gap:11px;padding:20px 18px 16px;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.sidebar-brand .brand-logo{width:36px;height:36px;border-radius:8px;border:1px solid rgba(255,255,255,.12);}
.sidebar-brand h1{
  margin:0;font-size:13px;line-height:1.2;letter-spacing:.01em;color:#fff;
  text-transform:none;font-weight:800;
}
.sidebar-brand span{
  display:block;margin-top:3px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--sidebar-ink-dim);font-weight:700;
}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;padding:14px 12px;flex:1;overflow-y:auto;}
.sidebar-nav button{
  display:flex;align-items:center;gap:11px;text-align:left;width:100%;
  padding:10px 12px;border-radius:8px;border:none;background:transparent;
  color:var(--sidebar-ink);font-size:13px;font-weight:600;cursor:pointer;
  font-family:inherit;letter-spacing:.01em;
}
.sidebar-nav button:hover{background:rgba(255,255,255,.06);color:#fff;}
.sidebar-nav button.active{background:var(--sidebar-active);color:#fff;box-shadow:inset 3px 0 0 var(--red);}
.sidebar-nav .snav-ico{
  width:18px;flex-shrink:0;text-align:center;font-size:13px;opacity:.85;font-style:normal;
}
.sidebar-foot{
  padding:14px 14px 16px;border-top:1px solid rgba(255,255,255,.07);
  display:flex;flex-direction:column;gap:6px;
}
.sidebar-user{
  font-size:11px;color:var(--sidebar-ink-dim);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;padding:0 2px 6px;
}
.sidebar-foot-btn{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);color:var(--sidebar-ink);
  padding:8px 10px;border-radius:7px;font-size:11.5px;font-weight:600;cursor:pointer;text-align:left;
  font-family:inherit;
}
.sidebar-foot-btn:hover{background:rgba(255,255,255,.1);color:#fff;}

.main-area{flex:1;min-width:0;display:flex;flex-direction:column;}
.main-area .topbar{
  position:sticky;top:0;z-index:30;background:#fff;
  padding:14px 28px;display:flex;align-items:center;justify-content:space-between;
  gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.03);
}
.main-area .stats{display:flex;gap:8px;}
.main-area .stat{
  min-width:70px;text-align:center;padding:6px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--paper);
}
.main-area .stat b{font-size:18px;line-height:1.1;color:var(--ink);}
.main-area .stat small{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:#6B7280;}
.main-area .dash-toolbar{position:sticky;top:63px;}
.main-area .storage-warning{position:sticky;top:63px;z-index:25;}

@media (max-width:900px){
  .app-shell{flex-direction:column;}
  .sidebar{
    width:100%;height:auto;position:relative;flex-direction:row;align-items:stretch;
    overflow-x:auto;
  }
  .sidebar-brand{border-bottom:none;border-right:1px solid rgba(255,255,255,.07);flex-shrink:0;}
  .sidebar-nav{flex-direction:row;padding:10px 10px;overflow-x:auto;flex:none;}
  .sidebar-nav button{flex-direction:column;gap:3px;white-space:nowrap;padding:8px 12px;font-size:10.5px;}
  .sidebar-nav button.active{box-shadow:inset 0 -3px 0 var(--red);}
  .sidebar-foot{flex-direction:row;align-items:center;border-top:none;border-left:1px solid rgba(255,255,255,.07);flex-shrink:0;}
  .sidebar-user{display:none;}
  .main-area .topbar{position:relative;padding:12px 18px;}
  .main-area .dash-toolbar,.main-area .storage-warning{position:relative;top:auto;}
  .main-area .stats{width:100%;overflow-x:auto;}
}
@media (max-width:560px){
  .main-area .topbar{flex-direction:column;align-items:stretch;}
  .main-area .topbar .btn-primary{width:100%;}
}

.contact-list{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow-sm);
}

  display:flex;align-items:center;gap:14px;padding:12px 16px;
  border-bottom:1px solid #EEF0F2;cursor:pointer;
}
.contact-row:last-child{border-bottom:none;}
.contact-row:hover{background:#F9FAFB;}
.contact-row-head{
  cursor:default;background:#F9FAFB;padding:9px 16px;
  font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#6B7280;font-weight:800;
}
.contact-row-head:hover{background:#F9FAFB;}
.contact-avatar-col{flex-shrink:0;width:38px;display:flex;justify-content:center;}
.contact-avatar{
  width:36px;height:36px;border-radius:50%;background:var(--primary-soft);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;
  letter-spacing:.02em;flex-shrink:0;
}
.contact-main{flex:1;min-width:0;}
.contact-name{
  font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.contact-name .etiqueta-badge{margin:0;}
.contact-sub{font-size:11.5px;color:#6B7280;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.contact-metrics{display:flex;gap:22px;flex-shrink:0;}
.contact-metrics .cm{text-align:center;min-width:56px;}
.contact-metrics .cm b{display:block;font-size:15px;font-weight:700;color:var(--ink);}
.contact-metrics .cm span{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:#6B7280;}
.contact-balance{
  flex-shrink:0;width:110px;text-align:right;font-family:'Courier New',monospace;
  font-weight:700;font-size:13px;color:var(--ink);
}
.contact-balance.neg{color:var(--red);}
.contact-chevron-col{flex-shrink:0;width:14px;text-align:center;color:#9AA3AF;font-size:16px;}

@media (max-width:760px){
  .contact-row{flex-wrap:wrap;gap:8px 12px;}
  .contact-row-head{display:none;}
  .contact-metrics{order:3;width:100%;padding-left:52px;gap:16px;}
  .contact-metrics .cm{text-align:left;min-width:auto;}

  .contact-chevron-col{order:2;}
}

  function tagOpen(name){ return '<' + name + '>'; }
  function tagClose(name){ return '<' + '/' + name + '>'; }

  function downloadPrintable(bodyHTML, filename, pageTitle, extraCSS){
    const printScript = tagOpen('script') + `
        function __triggerPrint(){
          requestAnimationFrame(function(){ requestAnimationFrame(function(){ setTimeout(function(){ try{ window.print(); }catch(e){} }, 200); }); });
        }
        if(document.readyState === 'complete'){ __triggerPrint(); }
        else { window.addEventListener('load', __triggerPrint); }
      ` + tagClose('script');
    const parts = [
      '<!DOCTYPE html>',
      tagOpen('html'),
      tagOpen('head'),
      '<meta charset="utf-8">',
      tagOpen('title'), pageTitle, tagClose('title'),
      tagOpen('style'), PRINT_BASE_CSS, (extraCSS||''), tagClose('style'),
      tagClose('head'),
      tagOpen('body'),
      '<button class="print-btn" onclick="window.print()">Imprimir' + tagClose('button'),
      bodyHTML,
      printScript,
      tagClose('body'),
      tagClose('html'),
    ];
    const fullHTML = parts.join('');

    // Primero intentamos abrir directo en una pestaña nueva (funciona si el navegador
    // lo permite, ya que se dispara justo al hacer clic).
    let opened = null;
    try{ opened = window.open('', '_blank'); }catch(e){ opened = null; }
    if(opened){
      try{
        opened.document.open();
        opened.document.write(fullHTML);
        opened.document.close();
        opened.focus();
        return;
      }catch(e){ /* si falla a mitad de camino, caemos a la descarga */ }
    }

    // Respaldo: si el navegador bloqueó la ventana nueva, descargamos el archivo.
    const blob = new Blob([fullHTML], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 4000);
    showToast('Tu navegador bloqueó la ventana emergente — se descargó el archivo, ábrelo para imprimir.');
  }

  function printCotizacion(oportunidadId){
    const o = oportunidades.find(x => x.id === oportunidadId);
    if(!o) return;
    const numero = 'COT-' + o.id.replace(/[^0-9]/g,'').slice(-6);
    const fechaEmision = new Date().toLocaleDateString('es-CR', {year:'numeric', month:'long', day:'numeric'});
    const fechaVencimiento = addDays(todayISO(), 15);
    const itemsValidos = (o.items||[]).filter(it => it.descripcion || it.precio);
    const montoItems = itemsValidos.reduce((s,it)=> s + ((parseFloat(it.cantidad)||1) * (parseFloat(it.precio)||0)), 0);
    // Los precios que se ingresan (los del inventario y los de cada línea) ya incluyen el IVA —
    // es el mismo precio final que paga el cliente, igual que en el facturador — así que el
    // impuesto se desglosa hacia atrás en vez de sumarse encima.
    const subtotal = itemsValidos.length ? montoItems : (parseFloat(o.montoEstimado) || 0);
    const descuento = Math.min(parseFloat(o.descuento) || 0, subtotal);
    const total = subtotal - descuento; // precio final que paga el cliente (IVA incluido)
    const baseImponible = total / 1.13;
    const iva = total - baseImponible;
    const body = `
      <div class="cot-head">

            const precio = parseFloat(it.precio)||0;
            return `<tr><td>${esc(it.descripcion||'—')}</td><td>${cant}</td><td>₡${precio.toLocaleString('es-CR',{maximumFractionDigits:0})}</td><td>₡${(cant*precio).toLocaleString('es-CR',{maximumFractionDigits:0})}</td></tr>`;

      </table>
      ${o.descripcion ? `<div class="cot-desc-box"><h3>Notas</h3><p style="margin:0;">${esc(o.descripcion)}</p></div>` : ''}

        <p style="margin:0;">${o.descripcion ? esc(o.descripcion) : 'Servicio de mantenimiento de extintores.'}</p>
      </div>
      `}
      <table class="cot-totales-table">
        <tr><td>Subtotal</td><td>₡${subtotal.toLocaleString('es-CR',{maximumFractionDigits:0})}</td></tr>
        ${descuento>0 ? `<tr class="cot-desc-row"><td>Descuento</td><td>− ₡${descuento.toLocaleString('es-CR',{maximumFractionDigits:0})}</td></tr>` : ''}
        <tr><td>Base imponible</td><td>₡${baseImponible.toLocaleString('es-CR',{maximumFractionDigits:0})}</td></tr>
        <tr><td>IVA (13%, incluido)</td><td>₡${iva.toLocaleString('es-CR',{maximumFractionDigits:0})}</td></tr>
      </table>

    `;

  function printMembresia(contratoId){

  function uid(){ return 'ext_' + Date.now() + '_' + Math.floor(Math.random()*10000); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function addMonths(dateStr, months){
    const d = new Date(dateStr + 'T00:00:00');
    if(isNaN(d)) return '';
    d.setMonth(d.getMonth() + months);
    return d.toISOString().slice(0,10);
  }
  function addDays(dateStr, days){
    const d = new Date(dateStr + 'T00:00:00');
    if(isNaN(d)) return dateStr;
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0,10);
  }
  function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function estadoOf(id){ return ESTADOS.find(e=>e.id===id) || ESTADOS[0]; }

  function saldoOf(rec){
    const precio = parseFloat(rec.precio) || 0;
    const abono = parseFloat(rec.abono) || 0;
    // Si el registro está marcado manualmente como "Pagado", el saldo es 0 sin importar el abono.
    const saldo = rec.pagado === 'pagado' ? 0 : Math.max(0, precio - abono);
    return { precio, abono, saldo, pagadoCompleto: precio > 0 && saldo <= 0 };
  }

  function cleanPhone(phone){
    let digits = (phone||'').replace(/\D/g,'');
    if(!digits) return '';
    if(digits.length === 8) digits = '506' + digits; // celular típico de Costa Rica sin código de país
    return digits;
  }

  function vencStatus(fecha){
    if(!fecha) return null;
    const d = new Date(fecha + 'T00:00:00');
    if(isNaN(d)) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    const diffDays = Math.round((d - today) / 86400000);
    if(diffDays < 0) return 'vencido';
    if(diffDays <= 30) return 'proximo';
    return 'ok';
  }

    });
    if(!res.ok) throw new Error('firestore set failed: ' + res.status);
  }

  function esperar(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

  async function conReintentos(fn, intentos){
    // Reintenta una operación async hasta 'intentos' veces, con espera creciente entre cada una
    // (300ms, luego 900ms). Devuelve el resultado si tiene éxito, o relanza el último error.
    let ultimoError = null;
    for(let i = 0; i < intentos; i++){
      try{
        return await fn();
      }catch(e){
        ultimoError = e;
        if(i < intentos - 1) await esperar(300 * Math.pow(3, i));
      }
    }
    throw ultimoError;
  }

  function saveSession(){
    try{
      if(authUser) localStorage.setItem(AUTH_SESSION_KEY, JSON.stringify(authUser));

    }catch(e){}
  }

  async function refreshIdTokenIfNeeded(){
    if(!authUser) return false;
    if(authUser.expiresAt && Date.now() < authUser.expiresAt - 60000) return true; // aún válido
    try{
      const res = await fetch(AUTH_REFRESH_URL, {
        method: 'POST',
        headers: {'Content-Type':'application/x-www-form-urlencoded'},
        body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(authUser.refreshToken)
      });
      if(!res.ok) return false;
      const data = await res.json();
      authUser = Object.assign({}, authUser, {
        idToken: data.id_token,
        refreshToken: data.refresh_token,
        expiresAt: Date.now() + (parseInt(data.expires_in,10) || 3600) * 1000,
      });
      saveSession();
      return true;
    }catch(e){ return false; }
  }

    if(!res.ok) throw new Error('user doc get failed: ' + res.status);
    const data = await res.json();
    return {
      role: data.fields && data.fields.role ? data.fields.role.stringValue : 'pending',
      email: data.fields && data.fields.email ? data.fields.email.stringValue : '',
    };

  async function ensureUserDoc(uid, email){

    const url = `${FIRESTORE_BASE}/users/${uid}?key=${FIREBASE_API_KEY}`;
    const body = { fields: {
      email: { stringValue: email || '' },
      role: { stringValue: role },
      createdAt: { stringValue: new Date().toISOString() },
    }};
    await fetch(url, {

      headers: Object.assign({'Content-Type':'application/json'}, authHeaders()),
      body: JSON.stringify(body)
    });

      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error && data.error.message || 'Error al crear la cuenta');
      authUser = {
        uid: data.localId, email: data.email, idToken: data.idToken,
        refreshToken: data.refreshToken, expiresAt: Date.now() + (parseInt(data.expiresIn,10)||3600)*1000,
      };
      saveSession();
      const profile = await ensureUserDoc(authUser.uid, authUser.email);
      userRole = profile.role;
      authBusy = false;
      afterAuthReady();
    }catch(e){
      authBusy = false;
      authError = translateAuthError(e.message);

    }

  async function doSignIn(email, password){

      authUser = {

      };
      saveSession();
      const profile = await ensureUserDoc(authUser.uid, authUser.email);
      userRole = profile.role;
      authBusy = false;

  function translateAuthError(msg){
    msg = msg || '';
    if(msg.includes('EMAIL_EXISTS')) return 'Ese correo ya tiene una cuenta — intenta iniciar sesión.';
    if(msg.includes('EMAIL_NOT_FOUND') || msg.includes('INVALID_PASSWORD') || msg.includes('INVALID_LOGIN_CREDENTIALS')) return 'Correo o contraseña incorrectos.';
    if(msg.includes('WEAK_PASSWORD')) return 'La contraseña debe tener al menos 6 caracteres.';
    if(msg.includes('INVALID_EMAIL')) return 'Ese correo no es válido.';
    return msg || 'Ocurrió un error, intenta de nuevo.';
  }

  async function load(){
    root.innerHTML = '<div class="loading">Cargando registros...</div>';
    loadError = null;
    let raw = null;

    // 1) Intentamos Firebase primero (guardado real y compartido entre todos), con reintentos
    //    por si hay un corte de red puntual al abrir la página.
    try{
      raw = await conReintentos(() => firestoreGet(), 3);
      firebaseOK = true;
    }catch(e){
      firebaseOK = false;
    }

    // 2) Si Firebase no respondió, probamos el guardado de Claude como respaldo.
    if(!firebaseOK){
      for(let wait = 0; wait < 8 && typeof window.storage === 'undefined'; wait++){
        await new Promise(r => setTimeout(r, 250));
      }
      storageOK = (typeof window.storage !== 'undefined' && !!window.storage);
      if(storageOK){
        let res = null, ok = false;
        for(let attempt = 0; attempt < 3 && !ok; attempt++){
          try{ res = await window.storage.get(STORAGE_KEY, true); ok = true; }
          catch(e){ if(attempt < 2) await new Promise(r => setTimeout(r, 400)); }
        }
        if(ok && res && res.value) raw = res.value;
      }
    }

    // 3) Último respaldo: el navegador local.
    localBackupOK = localStorageTest();
    if(raw === null && localBackupOK){
      try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
    }

    const parsed = raw ? JSON.parse(raw) : null;
    if(Array.isArray(parsed)){
      // Formato antiguo: el JSON guardado era solo el array de records.
      records = parsed;
      cajas = [];
      papelera = [];
      ventas = [];
      oportunidades = [];
      recordatorios = [];
      clientesPerfil = [];
      contratos = [];
      inventario = [];
    } else if(parsed && typeof parsed === 'object'){
      records = parsed.records || [];
      cajas = parsed.cajas || [];
      papelera = parsed.papelera || [];
      ventas = parsed.ventas || [];
      oportunidades = parsed.oportunidades || [];
      recordatorios = parsed.recordatorios || [];
      clientesPerfil = parsed.clientesPerfil || [];
      contratos = parsed.contratos || [];
      inventario = parsed.inventario || [];
    } else {
      records = [];
      cajas = [];
      papelera = [];
      ventas = [];
      oportunidades = [];
      recordatorios = [];
      clientesPerfil = [];
      contratos = [];
      inventario = [];
    }
    migrarServicioCombinado();
    limpiarTarjetasObsoletas();
    limpiarPapeleraVieja();
    const nuevasOportunidades = generarOportunidadesRenovacion();
    if(nuevasOportunidades > 0){
      await persist(); // persist() ya llama a render() al final
    } else {
      render();
    }
  }

  function limpiarPapeleraVieja(){
    // Los elementos con más de 30 días en la papelera se eliminan definitivamente, para que no crezca sin límite.
    const LIMITE_DIAS = 30;
    const ahora = Date.now();
    const antes = papelera.length;
    papelera = papelera.filter(p => (ahora - p.fechaEliminado) < LIMITE_DIAS * 24 * 60 * 60 * 1000);
    return papelera.length !== antes; // true si se quitó algo
  }

  function limpiarTarjetasObsoletas(){
    // Evita que las listas de tarjetas abiertas/cerradas crezcan sin límite con registros ya eliminados.
    const idsVigentes = new Set(
      records.map(r => 'card-' + r.id).concat(records.map(r => 'item-' + r.id)).concat(ventas.map(v => 'venta-' + v.id)).concat(contratos.map(c => 'contrato-' + c.id)).concat(inventario.map(p => 'producto-' + p.id))
    );
    const ordenesVigentes = new Set(records.filter(r=>r.orden).map(r => 'order-' + ordenKey(r)));
    tarjetasAbiertas = new Set([...tarjetasAbiertas].filter(k => idsVigentes.has(k)));
    tarjetasCerradas = new Set([...tarjetasCerradas].filter(k => ordenesVigentes.has(k)));
    guardarSetLocal(TARJETAS_ABIERTAS_KEY, tarjetasAbiertas);
    guardarSetLocal(TARJETAS_CERRADAS_KEY, tarjetasCerradas);
  }

  function migrarServicioCombinado(){
    // Registros antiguos podían tener "Recarga" y "Mantenimiento general" como servicios separados.
    // Se combinan en "Recarga + Mantenimiento general", sumando sus precios si ambos los tenían.
    const NOMBRE_COMBINADO = 'Recarga + Mantenimiento general';
    records = records.map(rec => {
      const servicios = rec.servicios || [];
      const teniaRecarga = servicios.includes('Recarga');
      const teniaMant = servicios.includes('Mantenimiento general');
      if(!teniaRecarga && !teniaMant) return rec;
      const precios = { ...(rec.servicioPrecios || {}) };
      const precioRecarga = parseFloat(precios['Recarga']) || 0;
      const precioMant = parseFloat(precios['Mantenimiento general']) || 0;
      const precioCombinado = precioRecarga + precioMant;
      delete precios['Recarga'];
      delete precios['Mantenimiento general'];
      if(precioCombinado > 0) precios[NOMBRE_COMBINADO] = String(precioCombinado);
      const nuevosServicios = servicios.filter(s => s !== 'Recarga' && s !== 'Mantenimiento general');
      if(!nuevosServicios.includes(NOMBRE_COMBINADO)) nuevosServicios.unshift(NOMBRE_COMBINADO);
      return { ...rec, servicios: nuevosServicios, servicioPrecios: precios };
    });
  }

  async function persist(){
    const json = JSON.stringify({ records, cajas, papelera, ventas, oportunidades, recordatorios, clientesPerfil, contratos, inventario });

    // Siempre intentamos Firebase primero, sin importar si un guardado anterior en esta
    // sesión falló — un corte de internet puntual no debe "apagar" la nube para siempre.
    let firebaseSaved = false;
    try{
      await conReintentos(async () => {
        await firestoreSet(json);
        const check = await firestoreGet();
        if(check !== json) throw new Error('firestore verificación no coincide');
      }, 3);
      firebaseSaved = true;
      firebaseOK = true;
    }catch(e){
      firebaseSaved = false;
      // No apagamos firebaseOK aquí: el próximo guardado vuelve a intentar desde cero.
    }

    let cloudOk = false;
    if(!firebaseSaved && storageOK){
      try{
        await window.storage.set(STORAGE_KEY, json, true);
        const check = await window.storage.get(STORAGE_KEY, true);
        cloudOk = !!(check && check.value === json);
      }catch(e){ cloudOk = false; }
    }

    let localOk = false;
    if(localBackupOK){
      try{
        localStorage.setItem(STORAGE_KEY, json);
        localOk = (localStorage.getItem(STORAGE_KEY) === json);
      }catch(e){ localOk = false; }
    }

    lastSaveVerified = firebaseSaved || cloudOk || localOk;
    lastSaveFailedToCloud = !firebaseSaved; // aunque haya quedado en local/Claude, no llegó al guardado compartido real
    if(!lastSaveVerified){
      showToast('⚠ El guardado no se pudo confirmar. No cierres todavía.');
    } else if(lastSaveFailedToCloud){
      showToast('⚠ Se guardó solo en este navegador, NO en la nube compartida. No cierres ni subas nada — revisa tu conexión y vuelve a intentar.');
    }
    render();
    return lastSaveVerified;
  }

  async function save(){

      const servicioPrecios = {};

        const nombre = inp.getAttribute('data-servicio-nombre');

      const updated = {

  function generarOportunidadesRenovacion(){
    // Crea automáticamente una oportunidad ("Contactado") cuando un extintor está a 30-45 días
    // de vencer, para que el embudo se alimente solo del negocio recurrente de mantenimiento.
    // Usa origenRecordId para nunca duplicar la misma oportunidad en cargas futuras.
    const yaExisten = new Set(oportunidades.filter(o=>o.origenRecordId).map(o=>o.origenRecordId));
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    let creadas = 0;
    records.forEach(r=>{
      if(!r.fechaVencimiento || yaExisten.has(r.id)) return;
      const d = new Date(r.fechaVencimiento + 'T00:00:00');
      if(isNaN(d)) return;
      const diffDays = Math.round((d - hoy) / 86400000);
      if(diffDays < 30 || diffDays > 45) return;
      oportunidades = [{
        id: uid(),
        cliente: r.cliente || '',
        telefono: r.telefono || '',
        descripcion: `Renovación — ${r.tipo || 'extintor'}${r.capacidad ? ' '+r.capacidad : ''} (vence ${r.fechaVencimiento})`,
        montoEstimado: r.precio || '',
        etapa: 'contactado',
        fechaCreacion: todayISO(),
        bitacora: [],
        origenRecordId: r.id,
        autoGenerada: true,
      }, ...oportunidades];
      yaExisten.add(r.id);
      creadas++;
    });
    return creadas;
  }

  function actualizarTotalesPreviewOportunidad(){
    const cont = document.getElementById('of-totales-preview');
    if(!cont) return;
    const montoEl = document.getElementById('of-monto');
    const descEl = document.getElementById('of-descuento');
    if(!montoEl || !descEl) return;
    const itemsValidos = Array.from(document.querySelectorAll('[data-item-line]')).map(div=>{
      const itemId = div.getAttribute('data-item-line');
      const precioEl = document.getElementById('oi-precio-'+itemId);
      const cantEl = document.getElementById('oi-cantidad-'+itemId);
      const cant = cantEl ? (parseFloat(cantEl.value) || 0) : 1;
      return cant * (parseFloat(precioEl ? precioEl.value : '') || 0);
    });
    const sumaItems = itemsValidos.reduce((s,v)=>s+v, 0);
    const subtotal = sumaItems > 0 ? sumaItems : (parseFloat(montoEl.value) || 0);
    const descuento = Math.min(parseFloat(descEl.value) || 0, subtotal);
    // Los precios ya incluyen el IVA (igual que en el facturador): se desglosa hacia atrás, no se suma encima.
    const total = subtotal - descuento;
    const baseImponible = total / 1.13;
    const iva = total - baseImponible;
    cont.innerHTML = `
      <div class="of-totales-row"><span>Subtotal</span><b>₡${subtotal.toLocaleString('es-CR',{maximumFractionDigits:0})}</b></div>
      ${descuento>0 ? `<div class="of-totales-row of-desc"><span>Descuento</span><b>− ₡${descuento.toLocaleString('es-CR',{maximumFractionDigits:0})}</b></div>` : ''}
      <div class="of-totales-row"><span>Base imponible</span><b>₡${baseImponible.toLocaleString('es-CR',{maximumFractionDigits:0})}</b></div>
      <div class="of-totales-row"><span>IVA (13%, incluido)</span><b>₡${iva.toLocaleString('es-CR',{maximumFractionDigits:0})}</b></div>
      <div class="of-totales-row of-total"><span>Total</span><b>₡${total.toLocaleString('es-CR',{maximumFractionDigits:0})}</b></div>
    `;
  }

  function clientesEnRiesgo(){
    // Un cliente está "en riesgo" si su recarga vencida más antigua pasó hace más de
    // DIAS_RIESGO_CLIENTE días Y no tiene ningún registro nuevo (fechaIngreso) después de esa fecha de vencimiento.
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    const clientes = agruparClientesMantenimiento();
    const enRiesgo = [];
    clientes.forEach(c=>{
      const vencidosDelCliente = c.registros.filter(r => r.fechaVencimiento && vencStatus(r.fechaVencimiento) === 'vencido');
      if(vencidosDelCliente.length === 0) return;
      // La fecha de vencimiento más antigua (la más urgente) de este cliente.
      const masAntigua = vencidosDelCliente.reduce((min,r)=> (!min || r.fechaVencimiento < min) ? r.fechaVencimiento : min, null);
      const fechaVenc = new Date(masAntigua + 'T00:00:00');
      const diasVencido = Math.round((hoy - fechaVenc) / 86400000);
      if(diasVencido < DIAS_RIESGO_CLIENTE) return;
      // ¿Volvió después de que venció? Si tiene algún registro con fechaIngreso posterior a la fecha de vencimiento, ya no está en riesgo.
      const volvioDespues = c.registros.some(r => r.fechaIngreso && r.fechaIngreso > masAntigua);
      if(volvioDespues) return;
      enRiesgo.push({ ...c, fechaVencimientoMasAntigua: masAntigua, diasVencido });
    });
    return enRiesgo.sort((a,b)=> b.diasVencido - a.diasVencido);
  }

  function tasaRenovacionAnual(){
    // De los clientes cuya recarga venció hace más de DIAS_RIESGO_CLIENTE días (tiempo suficiente
    // para juzgar), ¿qué % sí volvió a renovar (tiene un registro nuevo después de esa fecha)?
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    const clientes = agruparClientesMantenimiento();
    let juzgables = 0, renovaron = 0;
    clientes.forEach(c=>{
      const vencidosDelCliente = c.registros.filter(r => r.fechaVencimiento && vencStatus(r.fechaVencimiento) === 'vencido');
      if(vencidosDelCliente.length === 0) return;
      const masAntigua = vencidosDelCliente.reduce((min,r)=> (!min || r.fechaVencimiento < min) ? r.fechaVencimiento : min, null);
      const fechaVenc = new Date(masAntigua + 'T00:00:00');
      const diasVencido = Math.round((hoy - fechaVenc) / 86400000);
      if(diasVencido < DIAS_RIESGO_CLIENTE) return;
      juzgables++;
      if(c.registros.some(r => r.fechaIngreso && r.fechaIngreso > masAntigua)) renovaron++;
    });
    return { porcentaje: juzgables > 0 ? Math.round((renovaron/juzgables)*100) : null, renovaron, juzgables };
  }

    document.querySelectorAll('[data-item-precio]').forEach(inp=>{

    document.querySelectorAll('[data-item-cantidad]').forEach(inp=>{

    });

    if(ofMontoEl) ofMontoEl.addEventListener('input', actualizarTotalesPreviewOportunidad);

  }

  async function restaurarDePapelera(papeleraId){
    const item = papelera.find(p => p.id === papeleraId);
    if(!item) return;
    papelera = papelera.filter(p => p.id !== papeleraId);
    if(item.tipo === 'extintor'){
      records = [item.data, ...records];
    } else if(item.tipo === 'venta'){
      ventas = [item.data, ...ventas];
    } else if(item.tipo === 'oportunidad'){
      oportunidades = [item.data, ...oportunidades];
    } else if(item.tipo === 'recordatorio'){
      recordatorios = [item.data, ...recordatorios];
    } else if(item.tipo === 'perfil_cliente'){
      clientesPerfil = [item.data, ...clientesPerfil];
    } else if(item.tipo === 'contrato'){
      contratos = [item.data, ...contratos];
    } else if(item.tipo === 'producto_inventario'){
      inventario = [item.data, ...inventario];
    } else if(item.tipo === 'movimiento_caja'){
      const caja = cajas.find(c => c.id === item.cajaId);
      if(caja){
        caja.movimientos = [...caja.movimientos, item.data];
        cajas = cajas.map(c => c.id === caja.id ? caja : c);
      } else {
        showToast('No se pudo restaurar: la caja de ese día ya no existe.');
        papelera.push(item); // lo regresamos a la papelera, no se pierde
        render();
        return;
      }
    }
    await persist();
    showToast('Restaurado correctamente.');
    render();
  }

  async function advance(id){
    const order = ['recibido','proceso','listo','entregado'];
    const rec = records.find(r=>r.id===id);
    if(!rec) return;
    const idx = order.indexOf(rec.estado);
    if(idx < order.length - 1){
      rec.estado = order[idx+1];
      await persist();
      showToast('Estado: ' + estadoOf(rec.estado).label);
      render();
    }
  }

    });

  const METODOS_PAGO = ['Efectivo','SINPE','Tarjeta','Transferencia','Crédito'];

  function calcularEsperado(caja){
    // El cuadre físico de caja es SOLO efectivo (apertura + entradas efectivo - salidas efectivo).
    // Los demás métodos de pago se informan aparte, sin afectar el efectivo esperado.
    const movs = caja.movimientos.map(m => ({ ...m, metodo: m.metodo || 'Efectivo' }));
    const efectivoEntradas = movs.filter(m=>m.tipo==='entrada' && m.metodo==='Efectivo').reduce((s,m)=>s+m.monto,0);
    const efectivoSalidas = movs.filter(m=>m.tipo==='salida' && m.metodo==='Efectivo').reduce((s,m)=>s+m.monto,0);
    const entradas = movs.filter(m=>m.tipo==='entrada').reduce((s,m)=>s+m.monto,0);
    const salidas = movs.filter(m=>m.tipo==='salida').reduce((s,m)=>s+m.monto,0);
    const porMetodo = {};
    METODOS_PAGO.forEach(met=>{
      const ent = movs.filter(m=>m.tipo==='entrada' && m.metodo===met).reduce((s,m)=>s+m.monto,0);
      const sal = movs.filter(m=>m.tipo==='salida' && m.metodo===met).reduce((s,m)=>s+m.monto,0);
      if(ent > 0 || sal > 0) porMetodo[met] = { entradas: ent, salidas: sal };
    });
    return {
      entradas, salidas, // totales generales (todos los métodos), para el resumen del mes
      efectivoEntradas, efectivoSalidas,
      esperado: caja.apertura + efectivoEntradas - efectivoSalidas, // solo lo que debe cuadrar en físico
      porMetodo,
    };
  }

  function resumenMes(){
    const now = new Date();
    const ym = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
    const delMes = cajas.filter(c => c.fecha.slice(0,7) === ym);
    let totalEntradas = 0, totalSalidas = 0;
    const porMetodoMes = {};
    delMes.forEach(c=>{
      const r = calcularEsperado(c);
      totalEntradas += r.entradas;
      totalSalidas += r.salidas;
      Object.keys(r.porMetodo).forEach(met=>{
        if(!porMetodoMes[met]) porMetodoMes[met] = { entradas: 0, salidas: 0 };
        porMetodoMes[met].entradas += r.porMetodo[met].entradas;
        porMetodoMes[met].salidas += r.porMetodo[met].salidas;
      });
    });
    return { dias: delMes.length, totalEntradas, totalSalidas, neto: totalEntradas - totalSalidas, porMetodoMes };
  }

  function resumenAnio(){
    const now = new Date();
    const anio = String(now.getFullYear());
    const delAnio = cajas.filter(c => c.fecha.slice(0,4) === anio);
    let totalEntradas = 0, totalSalidas = 0;
    const porMetodoAnio = {};
    delAnio.forEach(c=>{
      const r = calcularEsperado(c);
      totalEntradas += r.entradas;
      totalSalidas += r.salidas;
      Object.keys(r.porMetodo).forEach(met=>{
        if(!porMetodoAnio[met]) porMetodoAnio[met] = { entradas: 0, salidas: 0 };
        porMetodoAnio[met].entradas += r.porMetodo[met].entradas;
        porMetodoAnio[met].salidas += r.porMetodo[met].salidas;
      });
    });
    return { anio, dias: delAnio.length, totalEntradas, totalSalidas, neto: totalEntradas - totalSalidas, porMetodoAnio };
  }

              : (diff > 0 ? `Sobran ₡${diff.toLocaleString('es-CR',{maximumFractionDigits:0})} respecto a lo esperado.` : `Faltan ₡${Math.abs(diff).toLocaleString('es-CR',{maximumFractionDigits:0})} respecto a lo esperado.`);

    return `
