  function setView(v){ view = v; if(v!=='clientes') clienteSeleccionado = null; animateViewChange = true; render(); }
  function abrirCliente(key, tipo){ clienteSeleccionado = key; clienteSeleccionadoTipo = tipo || 'mantenimiento'; animateViewChange = true; render(); }
  function volverClientes(){ clienteSeleccionado = null; animateViewChange = true; render(); }
  function setClientesSubvista(v){ clientesSubvista = v; clienteQuery = ''; animateViewChange = true; render(); }
  function setClienteQuery(v){ clienteQuery = v; render(); }

  function clienteKey(rec){
    // Un cliente se identifica solo por el nombre (normalizado), para que un mismo cliente
    // con distintos números de teléfono en diferentes registros se unifique en una sola ficha
    // en vez de partirse en varias. Los teléfonos se acumulan aparte (ver telefonosDeCliente).
    return (rec.cliente||'').trim().toLowerCase();
  }

  function inicialesDe(nombre){
    const partes = (nombre||'').trim().split(/\s+/).filter(Boolean);
    if(partes.length === 0) return '?';
    if(partes.length === 1) return partes[0].slice(0,2).toUpperCase();
    return (partes[0][0] + partes[partes.length-1][0]).toUpperCase();
  }

  function telefonosTexto(c){
    const lista = (c && c.telefonos) || [];
    if(lista.length === 0) return '';
    return lista.join(' · ');
  }

  function perfilDeCliente(key){
    return clientesPerfil.find(p => clienteKey(p) === key) || null;
  }

  const ETIQUETAS_CLIENTE = ['VIP','Corporativo','Residencial','Moroso'];
  function emptyPerfilCliente(){
    return { id:null, cliente:'', telefono:'', empresa:'', cedula:'', notas:'', etiquetas:[] };
  }
  let perfilForm = emptyPerfilCliente();
  let editingPerfilKey = null; // clienteKey del perfil que se está editando (null = creando uno nuevo)

  /* ---------- Separar cliente (cuando dos personas distintas quedaron unidas por compartir nombre) ---------- */

  let separarClienteKey = null;

  function abrirSepararCliente(key){
    separarClienteKey = key;
    renderSepararClienteModal(true);
  }
  function closeSepararClienteModal(){
    separarClienteKey = null;
    renderSepararClienteModal(false);
  }

  function separarClientePorTelefono(key, telefonoElegidoRaw, nuevoNombreRaw){
    const nuevoNombre = (nuevoNombreRaw||'').trim();
    if(!nuevoNombre) return false;
    if(nuevoNombre.trim().toLowerCase() === key) return false; // no tiene sentido "separar" con el mismo nombre
    const telLimpio = cleanPhone(telefonoElegidoRaw);
    const coincide = (obj) => clienteKey(obj) === key && cleanPhone(obj.telefono) === telLimpio;

    records = records.map(r => coincide(r) ? { ...r, cliente: nuevoNombre } : r);
    ventas = ventas.map(v => coincide(v) ? { ...v, cliente: nuevoNombre } : v);
    contratos = contratos.map(c => coincide(c) ? { ...c, cliente: nuevoNombre } : c);
    oportunidades = oportunidades.map(o => coincide(o) ? { ...o, cliente: nuevoNombre } : o);
    recordatorios = recordatorios.map(r => coincide(r) ? { ...r, cliente: nuevoNombre } : r);
    clientesPerfil = clientesPerfil.map(p => coincide(p) ? { ...p, cliente: nuevoNombre } : p);
    cajas = cajas.map(c => ({
      ...c,
      movimientos: (c.movimientos||[]).map(m => coincide(m) ? { ...m, cliente: nuevoNombre } : m),
    }));
    return true;
  }

  async function saveSepararCliente(){
    const key = separarClienteKey;
    const telefono = document.getElementById('sep-telefono').value;
    const nuevoNombre = document.getElementById('sep-nombre').value.trim();
    if(!nuevoNombre){
      showToast('Escribí el nombre para la persona que se va a separar.');
      return;
    }
    const saveBtn = document.getElementById('separar-modal-save');
    if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Separando...'; }
    const ok = separarClientePorTelefono(key, telefono, nuevoNombre);
    if(!ok){
      if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = 'Separar'; }
      showToast('Elegí un nombre distinto al del cliente actual.');
      return;
    }
    const persistOk = await persist();
    if(!persistOk){
      if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = 'Separar'; }
      return;
    }
    showToast(`Listo — "${nuevoNombre}" quedó separado como un cliente aparte.`);
    closeSepararClienteModal();
    clienteSeleccionado = null;
    render();
  }

  function renderSepararClienteModal(open){
    let overlay = document.querySelector('.separar-cliente-overlay');
    if(!open){
      if(overlay) overlay.remove();
      return;
    }
    if(overlay) overlay.remove();
    const key = separarClienteKey;
    const clientes = agruparClientesMantenimiento().concat(agruparClientesCompras());
    const c = clientes.find(x=>x.key===key);
    const telefonos = (c && c.telefonos) || [];
    if(!key || telefonos.length < 2) return;
    overlay = document.createElement('div');
    overlay.className = 'overlay separar-cliente-overlay';
    overlay.innerHTML = `
      <div class="modal" style="max-width:460px;">
        <div class="modal-head">
          <h2>Separar cliente</h2>
          <button id="separar-modal-close">×</button>
        </div>
        <div class="modal-body">
          <p class="caja-hint" style="margin-top:0;">"${esc(c.nombre)}" tiene más de un número guardado. Si en realidad son dos personas distintas que comparten el mismo nombre, elegí el número que pertenece a la otra persona y escribí su nombre para separarla en una ficha aparte con su propio historial.</p>
          <div class="form-row full">
            <div><label>Número a separar</label>
              <select id="sep-telefono">
                ${telefonos.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="form-row full">
            <div><label>Nombre de esa persona</label><input id="sep-nombre" placeholder="Ej: ${esc(c.nombre)} (Cartago)"/></div>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn-ghost" id="separar-modal-cancel">Cancelar</button>
          <button class="btn-primary" id="separar-modal-save">Separar</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeSepararClienteModal(); });
    document.getElementById('separar-modal-close').addEventListener('click', closeSepararClienteModal);
    document.getElementById('separar-modal-cancel').addEventListener('click', closeSepararClienteModal);
    document.getElementById('separar-modal-save').addEventListener('click', saveSepararCliente);
  }

  function openNuevoPerfilCliente(){
    perfilForm = emptyPerfilCliente();
    editingPerfilKey = null;
    renderPerfilClienteModal(true);
  }

  function openEditarPerfilCliente(key, nombrePrellenado, telefonoPrellenado){
    const existente = perfilDeCliente(key);
    perfilForm = existente ? Object.assign({}, existente) : Object.assign(emptyPerfilCliente(), { cliente: nombrePrellenado||'', telefono: telefonoPrellenado||'' });
    editingPerfilKey = key;
    renderPerfilClienteModal(true);
  }

  function closePerfilClienteModal(){ renderPerfilClienteModal(false); }

  async function savePerfilCliente(){
    const cliente = document.getElementById('pf-cliente').value.trim();
    if(!cliente){
      showToast('El nombre del cliente es obligatorio.');
      return;
    }
    const datos = {
      id: (perfilForm && perfilForm.id) || uid(),
      cliente,
      telefono: document.getElementById('pf-telefono').value.trim(),
      empresa: document.getElementById('pf-empresa').value.trim(),
      cedula: document.getElementById('pf-cedula').value.trim(),
      notas: document.getElementById('pf-notas').value.trim(),
      etiquetas: Array.from(document.querySelectorAll('.pf-etiqueta:checked')).map(el => el.value),
    };
    const keyNuevo = clienteKey(datos);
    const yaExiste = clientesPerfil.some(p => clienteKey(p) === keyNuevo && clienteKey(p) !== editingPerfilKey);
    if(yaExiste){
      showToast('Ya existe un perfil con ese nombre y teléfono.');
      return;
    }
    if(editingPerfilKey){
      const idx = clientesPerfil.findIndex(p => clienteKey(p) === editingPerfilKey);
      if(idx !== -1){
        // Ya existía una ficha para este cliente: se actualiza en su lugar.
        clientesPerfil = clientesPerfil.map((p,i) => i === idx ? datos : p);
      } else {
        // Se abrió como "editar" (venía con un cliente ya identificado), pero todavía
        // no tenía ficha de datos guardada — se crea por primera vez.
        clientesPerfil = [datos, ...clientesPerfil];
      }
    } else {
      clientesPerfil = [datos, ...clientesPerfil];
    }
    const saveBtn = document.getElementById('perfil-modal-save');
    if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Guardando...'; }
    const ok = await persist();
    if(!ok){
      if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = 'Guardar'; }
      return;
    }
    showToast('Datos del cliente guardados.');
    const nuevaKey = keyNuevo;
    closePerfilClienteModal();
    clienteSeleccionado = nuevaKey;
    if(!editingPerfilKey){
      // Solo es una creación nueva desde el listado de "Mantenimiento" (el botón
      // "+ Nuevo cliente" solo existe en esa sub-pestaña); si veníamos editando el
      // perfil desde la ficha de un cliente ya abierta, se respeta su tipo actual
      // (mantenimiento o compras) para no mandarlo a la ficha equivocada.
      clienteSeleccionadoTipo = 'mantenimiento';
    }
    view = 'clientes';
    render();
  }

  function renderPerfilClienteModal(open){
    let overlay = document.querySelector('.perfil-cliente-overlay');
    if(!open){
      if(overlay) overlay.remove();
      return;
    }
    if(overlay) overlay.remove();
    overlay = document.createElement('div');
    overlay.className = 'overlay perfil-cliente-overlay';
    overlay.innerHTML = `
      <div class="modal" style="max-width:480px;">
        <div class="modal-head">
          <h2>${editingPerfilKey ? 'Editar datos del cliente' : 'Nuevo cliente'}</h2>
          <button id="perfil-modal-close">×</button>
        </div>
        <div class="modal-body">
          <div class="form-row">
            <div><label>Nombre *</label><input id="pf-cliente" value="${esc(perfilForm.cliente)}" placeholder="Nombre o empresa" ${editingPerfilKey?'readonly':''}/></div>
            <div><label>Teléfono</label><input type="tel" id="pf-telefono" value="${esc(perfilForm.telefono)}" placeholder="8888-8888" ${editingPerfilKey?'readonly':''}/></div>
          </div>
          ${editingPerfilKey ? `<div class="caja-hint" style="margin-top:-8px;">El nombre y teléfono no se pueden cambiar aquí — son los que vinculan su historial de compras y mantenimientos.</div>` : ''}
          <div class="form-row">
            <div><label>Empresa</label><input id="pf-empresa" value="${esc(perfilForm.empresa)}" placeholder="Si es cliente corporativo"/></div>
            <div><label>Cédula / identificación</label><input id="pf-cedula" value="${esc(perfilForm.cedula)}" placeholder="ej. 1-2345-6789"/></div>
          </div>
          <div class="form-row full">
            <div><label>Etiquetas</label>
              <div class="service-checks" style="grid-template-columns:1fr 1fr;">
                ${ETIQUETAS_CLIENTE.map(et=>`
                  <label class="service-check">
                    <input type="checkbox" class="pf-etiqueta" value="${et}" ${(perfilForm.etiquetas||[]).includes(et)?'checked':''}/>
                    <span>${et}</span>
                  </label>`).join('')}
              </div>
            </div>
          </div>
          <div class="form-row full">
            <div><label>Notas generales</label><textarea id="pf-notas" placeholder="Cualquier detalle útil sobre este cliente...">${esc(perfilForm.notas)}</textarea></div>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn-ghost" id="perfil-modal-cancel">Cancelar</button>
          <button class="btn-primary" id="perfil-modal-save">Guardar</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closePerfilClienteModal(); });
    document.getElementById('perfil-modal-close').addEventListener('click', closePerfilClienteModal);
    document.getElementById('perfil-modal-cancel').addEventListener('click', closePerfilClienteModal);
    document.getElementById('perfil-modal-save').addEventListener('click', savePerfilCliente);
  }

  async function removePerfilCliente(key){
    const p = perfilDeCliente(key);
    if(!p) return;
    if(!confirm(`¿Eliminar los datos de ${p.cliente}? Esto no borra sus compras ni mantenimientos, solo la ficha de datos personales.`)) return;
    clientesPerfil = clientesPerfil.filter(x => clienteKey(x) !== key);
    papelera.push({ id: uid(), tipo: 'perfil_cliente', fechaEliminado: Date.now(), data: p });
    await persist();
    showToast('Datos del cliente movidos a la papelera.');
    volverClientes();
  }

  /* ---------- Contratos de mantenimiento recurrente ---------- */

  function emptyContrato(){
    return { id:null, cliente:'', telefono:'', cedulaCliente:'', encargado:'', correo:'', direccion:'', tipoMembresia:'seguridad', cantidadExtintores:'', fechaInicio: todayISO(), fechaRenovacion:'', valorAnual:'', estado:'activo', notas:'' };
  }
  let contratoForm = emptyContrato();
  let editingContratoId = null;

  function openNuevoContrato(clientePrellenado, telefonoPrellenado){
    contratoForm = emptyContrato();
    if(clientePrellenado) contratoForm.cliente = clientePrellenado;
    if(telefonoPrellenado) contratoForm.telefono = telefonoPrellenado;

    if(!c) return;
    contratoForm = Object.assign({}, emptyContrato(), c);
    editingContratoId = id;
    renderContratoModal(true);

  function closeContratoModal(){ renderContratoModal(false); }

  async function saveContrato(){
    const cliente = document.getElementById('ct-cliente').value.trim();
    const fechaRenovacion = document.getElementById('ct-fechaRenovacion').value;
    if(!cliente){
      showToast('El cliente es obligatorio.');
      return;
    }
    if(!fechaRenovacion){
      showToast('La fecha de renovación es obligatoria.');
      return;
    }
    const nuevo = {
      id: editingContratoId || uid(),
      cliente,
      telefono: document.getElementById('ct-telefono').value.trim(),
      cedulaCliente: document.getElementById('ct-cedulaCliente').value.trim(),
      encargado: document.getElementById('ct-encargado').value.trim(),
      correo: document.getElementById('ct-correo').value.trim(),
      direccion: document.getElementById('ct-direccion').value.trim(),
      tipoMembresia: document.getElementById('ct-tipoMembresia').value,
      cantidadExtintores: document.getElementById('ct-cantidad').value.trim(),
      fechaInicio: document.getElementById('ct-fechaInicio').value,
      fechaRenovacion,
      valorAnual: document.getElementById('ct-valorAnual').value.trim(),
      estado: document.getElementById('ct-estado').value,
      notas: document.getElementById('ct-notas').value.trim(),
    };
    if(editingContratoId){
      contratos = contratos.map(c => c.id === editingContratoId ? nuevo : c);
    } else {
      contratos = [nuevo, ...contratos];
    }
    const saveBtn = document.getElementById('contrato-modal-save');
    if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Guardando...'; }
    const ok = await persist();
    if(!ok){
      if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = editingContratoId ? 'Guardar cambios' : 'Registrar membresía'; }
      return;
    }
    showToast(editingContratoId ? 'Membresía actualizada.' : 'Membresía registrada.');
    closeContratoModal();
    render();
  }

    if(!confirm(`¿Eliminar la membresía de ${c.cliente || 'este cliente'}? Podrás recuperarla desde la Papelera durante 30 días.`)) return;

    showToast('Membresía movida a la papelera.');

  /* ---------- Inventario ---------- */

  const CATEGORIAS_INVENTARIO = [
    { id:'extintor', label:'Extintores' },
    { id:'repuesto', label:'Repuestos' },
    { id:'servicio', label:'Servicios' },
  ];

  function emptyProducto(){
    return { id:null, nombre:'', categoria:'extintor', tipo:'', capacidad:'', cantidad:'0', cantidadMinima:'2', precioUnitario:'', notas:'', movimientos:[] };
  }
  let productoForm = emptyProducto();
  let editingProductoId = null;
  let inventarioFiltro = 'todos'; // 'todos' | 'extintor' | 'repuesto' | 'bajo'
  let inventarioQuery = '';

  function estadoStock(p){
    if(p.categoria === 'servicio') return 'ok'; // los servicios no se cuentan por unidades, no aplica "stock bajo"
    const cant = parseFloat(p.cantidad) || 0;
    const min = parseFloat(p.cantidadMinima) || 0;
    if(cant <= 0) return 'agotado';
    if(cant <= min) return 'bajo';
    return 'ok';
  }

  function productosStockBajo(){
    return inventario.filter(p => estadoStock(p) !== 'ok');
  }

  function setInventarioFiltro(f){ inventarioFiltro = f; render(); }
  function setInventarioQuery(v){ inventarioQuery = v; render(); }

  function openNuevoProducto(){
    productoForm = emptyProducto();
    editingProductoId = null;
    renderProductoModal(true);
  }

  function openEditarProducto(id){
    const p = inventario.find(x => x.id === id);
    if(!p) return;
    productoForm = Object.assign({}, p, { movimientos: [...(p.movimientos||[])] });
    editingProductoId = id;
    renderProductoModal(true);
  }

  function closeProductoModal(){ renderProductoModal(false); }

  async function saveProducto(){
    const nombre = document.getElementById('pr-nombre').value.trim();
    if(!nombre){
      showToast('El nombre del producto es obligatorio.');
      return;
    }
    const categoria = document.getElementById('pr-categoria').value;
    const esServicio = categoria === 'servicio';
    const precioEl = esServicio ? document.getElementById('pr-precio-servicio') : document.getElementById('pr-precio');
    const nuevo = {
      id: editingProductoId || uid(),
      nombre,
      categoria,
      tipo: document.getElementById('pr-tipo').value.trim(),
      capacidad: esServicio ? '' : document.getElementById('pr-capacidad').value.trim(),
      cantidad: esServicio ? '0' : (document.getElementById('pr-cantidad').value.trim() || '0'),
      cantidadMinima: esServicio ? '0' : (document.getElementById('pr-cantidad-minima').value.trim() || '0'),
      precioUnitario: precioEl ? precioEl.value.trim() : '',
      notas: document.getElementById('pr-notas').value.trim(),
      movimientos: productoForm.movimientos || [],
    };
    if(editingProductoId){
      inventario = inventario.map(p => p.id === editingProductoId ? nuevo : p);
    } else {
      inventario = [nuevo, ...inventario];
    }
    const saveBtn = document.getElementById('producto-modal-save');
    if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Guardando...'; }
    const ok = await persist();
    if(!ok){
      if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = editingProductoId ? 'Guardar cambios' : 'Registrar producto'; }
      return;
    }
    showToast(editingProductoId ? 'Producto actualizado.' : 'Producto registrado.');
    closeProductoModal();
    render();
  }

  async function removeProducto(id){
    const p = inventario.find(x => x.id === id);
    if(!p) return;
    if(!confirm(`¿Eliminar "${p.nombre}" del inventario? Podrás recuperarlo desde la Papelera durante 30 días.`)) return;
    inventario = inventario.filter(x => x.id !== id);
    papelera.push({ id: uid(), tipo: 'producto_inventario', fechaEliminado: Date.now(), data: p });

    showToast('Producto movido a la papelera.');
    render();

          </div>

      </div>
    `;
    document.body.appendChild(overlay);

      const camposCapacidad = document.getElementById('pr-campos-capacidad');

      document.getElementById('pr-precio').value = precioActual;

  function abrirMovimientoInventarioModal(productoId){
    const p = inventario.find(x => x.id === productoId);
    if(!p) return;
    let overlay = document.querySelector('.mov-inv-overlay');
    if(overlay) overlay.remove();
    overlay = document.createElement('div');
    overlay.className = 'overlay mov-inv-overlay';

        </div>

              <select id="mi-tipo">
                <option value="entrada">Entrada (compra/reposición)</option>
                <option value="salida">Salida (venta/uso)</option>

            </div>

          </div>

          </div>
        </div>
        <div class="modal-foot">
          <button class="btn-ghost" id="mov-inv-cancel">Cancelar</button>
          <button class="btn-primary" id="mov-inv-guardar">Registrar</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const cerrar = ()=> overlay.remove();
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) cerrar(); });
    document.getElementById('mov-inv-close').addEventListener('click', cerrar);
    document.getElementById('mov-inv-cancel').addEventListener('click', cerrar);
    document.getElementById('mov-inv-guardar').addEventListener('click', async ()=>{
      const tipo = document.getElementById('mi-tipo').value;
      const cantidad = parseFloat(document.getElementById('mi-cantidad').value);
      const nota = document.getElementById('mi-nota').value.trim();
      if(isNaN(cantidad) || cantidad <= 0){
        showToast('Ingresa una cantidad válida.');
        return;
      }
      const actual = parseFloat(p.cantidad) || 0;
      const nuevaCantidad = tipo === 'entrada' ? actual + cantidad : Math.max(0, actual - cantidad);
      const movimiento = { id: uid(), tipo, cantidad, fecha: todayISO(), nota };
      const actualizado = { ...p, cantidad: String(nuevaCantidad), movimientos: [movimiento, ...(p.movimientos||[])] };
      inventario = inventario.map(x => x.id === productoId ? actualizado : x);
      cerrar();
      await persist();
      showToast('Movimiento de stock registrado.');
      render();
    });

  function renderInventario(){
    const q = inventarioQuery.trim().toLowerCase();
    const filtrados = inventario.filter(p=>{
      if(inventarioFiltro === 'bajo' && estadoStock(p) === 'ok') return false;
      if(inventarioFiltro !== 'todos' && inventarioFiltro !== 'bajo' && p.categoria !== inventarioFiltro) return false;
      if(q && !(p.nombre||'').toLowerCase().includes(q)) return false;
      return true;
    }).sort((a,b)=> (a.nombre||'').localeCompare(b.nombre||''));
    const bajoCount = productosStockBajo().length;
    const valorTotal = inventario.reduce((s,p)=> s + (parseFloat(p.cantidad)||0) * (parseFloat(p.precioUnitario)||0), 0);
    return `
      <div class="dash-content">
        <div class="kpi-grid" style="margin-bottom:18px;">
          <div class="kpi-card">
            <div class="kpi-label">Productos en inventario</div>
            <div class="kpi-value">${inventario.length}</div>
            <div class="kpi-sub">₡${valorTotal.toLocaleString('es-CR',{maximumFractionDigits:0})} en valor total</div>
          </div>
          <div class="kpi-card kpi-red ${bajoCount>0?'kpi-critical':''}">
            <div class="kpi-label">Stock bajo o agotado</div>
            <div class="kpi-value">${bajoCount}</div>
            <div class="kpi-sub">Necesitan reposición</div>
          </div>
        </div>
        <div class="clientes-toolbar" style="padding:0 0 16px;flex-wrap:wrap;gap:10px;">
          <div class="filters">

  function crmDelCliente(key){
    // Reúne las oportunidades, recordatorios y contratos cuyo nombre+teléfono coincide con el cliente
    // actual, para mostrarlos directo en su ficha (vista 360) en vez de solo verlos desde el tab de CRM.
    const opsCliente = oportunidades.filter(o => clienteKey(o) === key);
    const recsCliente = recordatorios.filter(r => clienteKey(r) === key && !r.completado)
      .sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
    const contratosCliente = contratos.filter(c => clienteKey(c) === key);
    return { opsCliente, recsCliente, contratosCliente };
  }

  function crmClienteResumenHTML(key){

    return `

              <div>

                <div class="v-order">${o.montoEstimado ? '₡'+parseFloat(o.montoEstimado).toLocaleString('es-CR',{maximumFractionDigits:0}) : 'Sin monto estimado'}</div>

            </div>`).join('')}

      </div>

  function movimientosConCliente(){
    // Recorre todos los días de caja y junta los movimientos que llevan un cliente anotado
    // (servicios rápidos/informales que se cobraron en caja sin pasar por el formulario de ingreso).
    const lista = [];
    cajas.forEach(c=>{
      (c.movimientos||[]).forEach(m=>{
        if(m.cliente && m.cliente.trim()){
          lista.push({ ...m, fechaCaja: c.fecha });
        }
      });
    });
    return lista;
  }

  function agregarTelefono(c, telefono){
    if(!telefono) return;
    const limpio = cleanPhone(telefono);
    if(!limpio) return;
    if(!c._telSet) c._telSet = new Map();
    if(!c._telSet.has(limpio)) c._telSet.set(limpio, telefono.trim());
  }

  function agruparClientesMantenimiento(){
    const map = {};
    records.forEach(r=>{
      const key = clienteKey(r);
      if(!map[key]){
        map[key] = { key, nombre: r.cliente || 'Sin nombre', registros: [], movimientosInformales: [] };
      }
      map[key].registros.push(r);
      agregarTelefono(map[key], r.telefono);
    });
    movimientosConCliente().forEach(m=>{
      const key = clienteKey(m);
      if(!map[key]){
        map[key] = { key, nombre: m.cliente || 'Sin nombre', registros: [], movimientosInformales: [] };
      }
      map[key].movimientosInformales.push(m);
      agregarTelefono(map[key], m.telefono);
    });
    clientesPerfil.forEach(p=>{
      const key = clienteKey(p);
      if(!map[key]){
        map[key] = { key, nombre: p.cliente || 'Sin nombre', registros: [], movimientosInformales: [] };
      }
      agregarTelefono(map[key], p.telefono);
    });
    return Object.values(map).map(c=>{
      const totalPagadoRegistros = c.registros.reduce((s,r)=> s + (saldoOf(r).precio - saldoOf(r).saldo), 0);
      const totalPendienteRegistros = c.registros.reduce((s,r)=> s + saldoOf(r).saldo, 0);
      const totalInformal = c.movimientosInformales.reduce((s,m)=> s + (m.tipo==='entrada' ? m.monto : 0), 0);
      const ultimaFecha = c.registros.reduce((max,r)=> (r.fechaIngreso||'') > max ? (r.fechaIngreso||'') : max, '');
      const perfil = perfilDeCliente(c.key);
      const telefonos = c._telSet ? Array.from(c._telSet.values()) : [];
      return {
        ...c,
        telefonos,
        telefono: telefonos[0] || '',
        totalExtintores: c.registros.reduce((s,r)=>s+(r.cantidad||1),0),
        totalServicios: c.registros.length + c.movimientosInformales.length,
        totalPagado: totalPagadoRegistros + totalInformal,
        totalPendiente: totalPendienteRegistros,
        ultimaFecha,
        etiquetas: (perfil && perfil.etiquetas) || [],
        membresiaActiva: contratos.some(ct => clienteKey(ct) === c.key && ct.estado === 'activo'),
      };
    }).sort((a,b)=> a.nombre.localeCompare(b.nombre));
  }

  function agruparClientesCompras(){
    const map = {};
    ventas.forEach(v=>{
      const key = clienteKey(v);
      if(!map[key]){
        map[key] = { key, nombre: v.cliente || 'Sin nombre', compras: [] };
      }
      map[key].compras.push(v);
      agregarTelefono(map[key], v.telefono);
    });
    return Object.values(map).map(c=>{
      const totalPagado = c.compras.reduce((s,v)=> s + (saldoOf(v).precio - saldoOf(v).saldo), 0);
      const totalPendiente = c.compras.reduce((s,v)=> s + saldoOf(v).saldo, 0);
      const ultimaFecha = c.compras.reduce((max,v)=> (v.fechaCompra||'') > max ? (v.fechaCompra||'') : max, '');
      const perfil = perfilDeCliente(c.key);
      const telefonos = c._telSet ? Array.from(c._telSet.values()) : [];
      return {
        ...c,
        telefonos,
        telefono: telefonos[0] || '',
        totalCompras: c.compras.length,
        totalEquiposComprados: c.compras.reduce((s,v)=>s+(v.cantidad||1),0),
        totalPagado, totalPendiente, ultimaFecha,
        etiquetas: (perfil && perfil.etiquetas) || [],
        membresiaActiva: contratos.some(ct => clienteKey(ct) === c.key && ct.estado === 'activo'),
      };
    }).sort((a,b)=> a.nombre.localeCompare(b.nombre));
  }

  const MESES_CORTOS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

  function ingresosPorMes(){
    // Ingresos (dinero) de los últimos 6 meses, agrupados por mes de fechaIngreso (o fecha de entrega si no hay ingreso).
    const now = new Date();
    const months = [];
    for(let i=5;i>=0;i--){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      months.push({ key: d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'), label: MESES_CORTOS[d.getMonth()]+' '+String(d.getFullYear()).slice(2), total:0 });
    }
    records.forEach(r=>{
      const precio = parseFloat(r.precio);
      if(!precio || !r.fechaIngreso) return;
      const key = r.fechaIngreso.slice(0,7);
      const m = months.find(mo=>mo.key===key);
      if(m) m.total += precio;
    });
    return months;
  }

  function ventasPorMes(){
    // Ingresos por venta de equipos de los últimos 6 meses, agrupados por mes de fechaCompra.
    const now = new Date();
    const months = [];
    for(let i=5;i>=0;i--){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      months.push({ key: d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'), label: MESES_CORTOS[d.getMonth()]+' '+String(d.getFullYear()).slice(2), total:0, unidades:0 });
    }
    ventas.forEach(v=>{
      const precio = parseFloat(v.precio);
      if(!v.fechaCompra) return;
      const key = v.fechaCompra.slice(0,7);
      const m = months.find(mo=>mo.key===key);
      if(m){
        if(precio) m.total += precio;
        m.unidades += (v.cantidad || 1);
      }
    });
    return months;
  }

  function resumenVentasAnio(){
    const now = new Date();
    const anio = String(now.getFullYear());
    const delAnio = ventas.filter(v => (v.fechaCompra||'').slice(0,4) === anio);
    const totalMonto = delAnio.reduce((s,v)=> s + (parseFloat(v.precio)||0), 0);
    const totalUnidades = delAnio.reduce((s,v)=> s + (v.cantidad||1), 0);
    const porProducto = {};
    delAnio.forEach(v=>{
      const key = (v.marca ? v.marca+' — ' : '') + (v.producto || 'Sin especificar');
      porProducto[key] = (porProducto[key]||0) + (v.cantidad||1);
    });
    return { anio, cantidadVentas: delAnio.length, totalMonto, totalUnidades, porProducto };
  }

  function agruparPor(campo){
    const counts = {};
    records.forEach(r=>{
      const val = (r[campo] || 'Sin especificar').toString().trim() || 'Sin especificar';
      counts[val] = (counts[val]||0) + (r.cantidad || 1);
    });
    return Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  }

  function conteoPorEstado(){
    return ESTADOS.map(e => ({ ...e, count: records.filter(r=>r.estado===e.id).length }));
  }

  function proximosVencimientos(){
    const deMantenimiento = records
      .filter(r=>r.fechaVencimiento)
      .map(r=>({ rec:r, vs: vencStatus(r.fechaVencimiento), origen: 'mantenimiento', fecha: r.fechaVencimiento }));
    const deVentas = ventas
      .filter(v=>v.fechaProximoMantenimiento)
      .map(v=>({ rec:v, vs: vencStatus(v.fechaProximoMantenimiento), origen: 'venta', fecha: v.fechaProximoMantenimiento }));
    return [...deMantenimiento, ...deVentas]
      .filter(x=>x.vs === 'vencido' || x.vs === 'proximo')
      .sort((a,b)=> (a.fecha||'').localeCompare(b.fecha||''));
  }

  function barsHTML(data, colorCls, maxItems){
    const list = maxItems ? data.slice(0, maxItems) : data;
    if(!list.length) return '<div class="dash-empty">Sin datos todavía.</div>';
    const max = Math.max(...list.map(d=>d[1]), 1);
    return list.map(([label,val])=>`
      <div class="bar-row">
        <div class="bar-label" title="${esc(label)}">${esc(label)}</div>
        <div class="bar-track"><div class="bar-fill ${colorCls}" style="width:${Math.max(4,(val/max*100))}%"></div></div>
        <div class="bar-value">${val}</div>
      </div>`).join('');
  }

  function exportarRespaldoIndustrial(){
    const payload = {
      version:'CRM Industrial Extintores Seguridad 3.0',
      exportedAt:new Date().toISOString(),
      records,cajas,papelera,ventas,oportunidades,recordatorios,clientesPerfil,contratos,inventario
    };
    const blob = new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`respaldo-extintores-seguridad-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    showToast('Respaldo descargado.');
  }

      if(!r.fechaVencimiento) return false;
      const d=new Date(r.fechaVencimiento+'T00:00:00');

      return diff>=0 && diff<=30;
    });
    const vencidos = records.filter(r=>vencStatus(r.fechaVencimiento)==='vencido');
    const taller = records.filter(r=>r.estado==='recibido'||r.estado==='proceso');

    const clientes = new Set([
      ...records.map(r=>r.cliente).filter(Boolean),
      ...ventas.map(v=>v.cliente).filter(Boolean),
      ...clientesPerfil.map(c=>c.cliente).filter(Boolean),
      ...oportunidades.map(o=>o.cliente).filter(Boolean)
    ]);
    const porCobrar = records.reduce((s,r)=>s+(saldoOf(r).saldo||0),0);
    const stockBajo = typeof productosStockBajo==='function' ? productosStockBajo() : [];

    const opsAbiertas = oportunidades.filter(o=>o.etapa!=='perdido' && o.etapa!=='ganado');
    const recPend = recordatorios.filter(r=>!r.completado).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
    const proximos = [...en30].sort((a,b)=>(a.fechaVencimiento||'').localeCompare(b.fechaVencimiento||'')).slice(0,6);
    const riesgo = typeof clientesEnRiesgo==='function' ? clientesEnRiesgo().slice(0,6) : [];
    const estadoCounts = ESTADOS.map(e=>({e,n:records.filter(r=>r.estado===e.id).length}));
    const totalEstado=Math.max(records.length,1);

    return `

          </div>

            <button class="btn-primary" id="ind-nuevo">+ Nueva orden</button>

          </div>
        </div>

        <div class="crm-section-title"><h3>Indicadores de operación</h3><span>${todayISO()} · actualización en tiempo real de los datos cargados</span></div>
        <div class="crm-kpis-industrial">
          <div class="crm-kpi" data-ind-view="listado"><div class="icon">🧯</div><div class="value">${records.length}</div><div class="label">Activos registrados</div><div class="hint">${taller.length} en taller</div></div>
          <div class="crm-kpi ${vencidos.length?'critical':''}" data-ind-view="listado"><div class="icon">⚠️</div><div class="value">${vencidos.length}</div><div class="label">Recargas vencidas</div><div class="hint">${en30.length} vencen en 30 días</div></div>
          <div class="crm-kpi" data-ind-view="clientes"><div class="icon">🏢</div><div class="value">${clientes.size}</div><div class="label">Clientes</div><div class="hint">${riesgo.length} en riesgo detectado</div></div>
          <div class="crm-kpi" data-ind-view="crm"><div class="icon">📈</div><div class="value">${opsAbiertas.length}</div><div class="label">Oportunidades abiertas</div><div class="hint">${oportunidades.length} en total</div></div>
          <div class="crm-kpi" data-ind-view="inventario"><div class="icon">📦</div><div class="value">${stockBajo.length}</div><div class="label">Stock bajo</div><div class="hint">${inventario.length} productos controlados</div></div>
          <div class="crm-kpi" data-ind-view="caja"><div class="icon">₡</div><div class="value">₡${porCobrar.toLocaleString('es-CR',{maximumFractionDigits:0})}</div><div class="label">Por cobrar</div><div class="hint">${contratosActivos.length} membresías activas</div></div>
        </div>

        <div class="crm-section-title"><h3>Operación diaria</h3><span>Prioridades que requieren atención</span></div>
        <div class="crm-industrial-grid">
          <div class="crm-panel">
            <h4>Próximos vencimientos</h4>
            <div class="crm-list">
              ${proximos.length ? proximos.map(r=>`
                <div class="crm-list-row">
                  <div class="crm-list-main"><b>${esc(r.cliente||'Sin cliente')}</b><span>${esc(r.tipo||'Extintor')} · ${esc(r.capacidad||'')} · ${esc(r.orden||'Sin orden')}</span></div>
                  <span class="crm-pill amber">${esc(r.fechaVencimiento)}</span>
                </div>`).join('') : '<div class="dash-empty">No hay vencimientos en los próximos 30 días.</div>'}
            </div>
          </div>
          <div class="crm-panel">
            <h4>Producción / taller</h4>
            ${estadoCounts.map(x=>`
              <div style="margin-bottom:12px">
                <div style="display:flex;justify-content:space-between;font-size:11px"><b>${x.e.label}</b><span>${x.n}</span></div>
                <div class="crm-progress"><i style="width:${Math.max(x.n?4:0,x.n/totalEstado*100)}%;${x.e.id==='listo'?'background:var(--green)':x.e.id==='proceso'?'background:var(--primary)':x.e.id==='recibido'?'background:var(--amber)':'background:#64748B'}"></i></div>
              </div>`).join('')}
            <button class="btn-ghost" style="width:100%;margin-top:4px" data-ind-view="listado">Abrir órdenes de trabajo</button>
          </div>
          <div class="crm-panel">
            <h4>Acciones rápidas</h4>
            <div class="crm-actions-grid">
              <button class="crm-action" data-ind-view="clientes">👥 <span>Clientes<small>Ficha e historial</small></span></button>
              <button class="crm-action" data-ind-view="crm">📈 <span>Ventas<small>Pipeline comercial</small></span></button>
              <button class="crm-action" data-ind-view="inventario">📦 <span>Inventario<small>Repuestos y equipos</small></span></button>
              <button class="crm-action" data-ind-view="caja">💳 <span>Caja<small>Ingresos y egresos</small></span></button>
              <button class="crm-action" id="ind-rec">🔔 <span>Recordatorio<small>${recPend.length} pendientes</small></span></button>
              <button class="crm-action" id="ind-print">🖨️ <span>Listado<small>Imprimir órdenes</small></span></button>
            </div>
          </div>

          <div class="crm-panel">
            <h4>Clientes en riesgo</h4>
            <div class="crm-list">
              ${riesgo.length ? riesgo.map(r=>`
                <div class="crm-list-row">
                  <div class="crm-list-main"><b>${esc(r.cliente||r.nombre||'Cliente')}</b><span>${esc(r.telefono||'')} · seguimiento recomendado</span></div>
                  <span class="crm-pill red">Riesgo</span>
                </div>`).join('') : '<div class="dash-empty">No se detectan clientes en riesgo.</div>'}
            </div>
          </div>
          <div class="crm-panel">
            <h4>Seguimientos pendientes</h4>
            <div class="crm-list">
              ${recPend.slice(0,6).length ? recPend.slice(0,6).map(r=>`
                <div class="crm-list-row">
                  <div class="crm-list-main"><b>${esc(r.texto)}</b><span>${esc(r.cliente||'General')}</span></div>
                  <span class="crm-pill ${r.fecha && r.fecha<todayISO()?'red':'amber'}">${esc(r.fecha||'Sin fecha')}</span>
                </div>`).join('') : '<div class="dash-empty">No hay recordatorios pendientes.</div>'}
            </div>
          </div>
          <div class="crm-panel">
            <h4>Inventario crítico</h4>
            <div class="crm-list">
              ${stockBajo.slice(0,6).length ? stockBajo.slice(0,6).map(x=>`
                <div class="crm-list-row">
                  <div class="crm-list-main"><b>${esc(x.nombre)}</b><span>${esc(x.tipo||'')} · mínimo ${x.cantidadMinima||0}</span></div>
                  <span class="crm-pill red">${x.cantidad||0} uds</span>
                </div>`).join('') : '<div class="dash-empty">No hay productos por debajo del mínimo.</div>'}
            </div>
          </div>

          <div class="crm-panel full">
            <h4>Resumen ejecutivo</h4>
            <div class="crm-mini-grid">
              <div class="crm-mini"><b>${listos.length}</b><span>Listos para entrega</span></div>
              <div class="crm-mini"><b>${ventas.length}</b><span>Ventas registradas</span></div>
              <div class="crm-mini"><b>${contratosActivos.length}</b><span>Membresías activas</span></div>
              <div class="crm-mini"><b>₡${oportunidades.reduce((s,o)=>s+(parseFloat(o.montoEstimado)||0),0).toLocaleString('es-CR',{maximumFractionDigits:0})}</b><span>Pipeline estimado</span></div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function render(){
    if(loadError){
      root.innerHTML = `
        <div class="error-screen">
          <div class="error-box">
            <h2>No se pudo cargar la información</h2>

    const counts = {

      listos: records.filter(r=>r.estado==='listo').length,

      porCobrar: records.reduce((sum,r)=> sum + saldoOf(r).saldo, 0).toLocaleString('es-CR', {maximumFractionDigits:2}),

    const filtered = getFiltered();

    root.innerHTML = `

      ${!firebaseOK && !storageOK && !localBackupOK ? `<div class="storage-warning">⚠ No se detecta ninguna forma de guardar — lo que registres se perderá al cerrar.</div>` : ''}
      ${!firebaseOK && !storageOK && localBackupOK ? `<div class="storage-warning storage-warning-info">💾 Guardando solo en este navegador/computadora — no se comparte con otros dispositivos ni empleados.</div>` : ''}
      ${!firebaseOK && storageOK ? `<div class="storage-warning storage-warning-info">☁️ Guardando en la nube de Claude (no en Firebase) — funciona mientras uses esta app dentro de Claude.</div>` : ''}

      <aside class="sidebar">

          <button data-view="clientes" class="${view==='clientes'?'active':''}"><span class="snav-ico">◔</span>Clientes</button>
          <button data-view="crm" class="${view==='crm'?'active':''}"><span class="snav-ico">◆</span>Ventas / CRM</button>
          <button data-view="panel" class="${view==='panel'?'active':''}"><span class="snav-ico">▲</span>Indicadores</button>
          <button data-view="inventario" class="${view==='inventario'?'active':''}"><span class="snav-ico">▣</span>Inventario</button>
          <button data-view="caja" class="${view==='caja'?'active':''}"><span class="snav-ico">$</span>Caja</button>
        </nav>
        <div class="sidebar-foot">
          <div class="sidebar-user" title="${esc(authUser ? authUser.email : '')}">${esc(authUser ? authUser.email : '')}</div>
          <button class="sidebar-foot-btn" id="btn-papelera">Papelera${papelera.length ? ` (${papelera.length})` : ''}</button>
          ${userRole === 'admin' ? `<button class="sidebar-foot-btn" id="btn-admin-panel">Panel de administración</button>` : ''}
          <button class="sidebar-foot-btn" id="btn-logout">Cerrar sesión</button>
        </div>
      </aside>
      <div class="main-area">
      <div class="topbar">
        <div class="stats">
          <div class="stat"><b class="mono">${counts.total}</b><small>Total</small></div>
          <div class="stat"><b class="mono">${counts.activos}</b><small>En taller</small></div>
          <div class="stat"><b class="mono">${counts.listos}</b><small>Listos</small></div>
          <div class="stat ${counts.vencidos>0?'stat-critical':''}"><b class="mono" style="color:${counts.vencidos>0?'#DC2626':'inherit'}">${counts.vencidos}</b><small>Vencidos</small></div>
          <div class="stat"><b class="mono">₡${counts.porCobrar}</b><small>Por cobrar</small></div>
        </div>
        <button class="btn-primary" id="btn-quick-new">+ Nuevo ingreso</button>
      </div>

      <div class="${animateViewChange ? 'view-fade' : ''}">
      ${view === 'industrial' ? renderIndustrial() : (view === 'listado' ? `
      <div class="toolbar">
        <div class="filters">
          <button class="chip ${filter==='todos'?'active':''}" data-filter="todos">Todos</button>
          ${ESTADOS.map(e=>`<button class="chip ${filter===e.id?'active':''}" data-filter="${e.id}">${e.label}</button>`).join('')}
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <input class="search" id="search-input" placeholder="Buscar cliente, teléfono, orden, tipo, capacidad o servicio..." value="${esc(query)}"/>
          <button class="btn-ghost" id="btn-print">Imprimir consolidado</button>
          <button class="btn-primary" id="btn-new">+ Nuevo ingreso</button>
        </div>

          <button class="chip ${venceFilter==='todos'?'active':''}" data-vence-filter="todos">Recarga: todas</button>
          <button class="chip ${venceFilter==='vencidos'?'active':''}" data-vence-filter="vencidos">Vencidos</button>
          <button class="chip ${venceFilter==='proximo'?'active':''}" data-vence-filter="proximo">Por vencer (30 días)</button>
        </div>
      </div>

      <div class="content">
        ${filtered.length === 0 ? `
          <div class="empty">
            <svg viewBox="0 0 64 64" fill="none">
              <rect x="24" y="10" width="16" height="44" rx="6" stroke="#6B7280" stroke-width="2.5"/>
              <rect x="28" y="4" width="8" height="8" rx="1.5" stroke="#6B7280" stroke-width="2.5"/>
              <path d="M20 22 L24 22" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <p>${records.length===0 ? 'Aún no hay extintores registrados.' : 'Nada coincide con ese filtro o búsqueda.'}</p>
          </div>` : `
          <div class="grid">${agruparPorOrden(filtered).map(orderCardHTML).join('')}</div>`
        }
      </div>
      ` : (view === 'panel' ? renderDashboard() : (view === 'caja' ? renderCaja() : (view === 'crm' ? renderCRM() : (view === 'inventario' ? renderInventario() : (view === 'clientes' ? (clienteSeleccionado ? renderClienteDetalle(clienteSeleccionado) : renderClientesLista()) : renderIndustrial()))))))}
      </div>
      </div>
      </div>
      </div>
    `;

    animateViewChange = false;

    document.querySelectorAll('[data-view]').forEach(b=>{
      b.addEventListener('click', ()=> setView(b.getAttribute('data-view')));
    });
    document.querySelectorAll('details[data-card-key]').forEach(d=>{
      d.addEventListener('toggle', ()=>{
        const key = d.getAttribute('data-card-key');
        if(d.hasAttribute('data-default-open')){
          // Tarjetas de orden: abiertas por defecto; solo registramos cuando el usuario las cierra.
          if(d.open) tarjetasCerradas.delete(key); else tarjetasCerradas.add(key);
          guardarSetLocal(TARJETAS_CERRADAS_KEY, tarjetasCerradas);
        } else {

          guardarSetLocal(TARJETAS_ABIERTAS_KEY, tarjetasAbiertas);
        }
      });

    document.getElementById('btn-logout').addEventListener('click', doSignOut);
    const btnAdmin = document.getElementById('btn-admin-panel');

    const quickNew = document.getElementById('btn-quick-new');
    if(quickNew) quickNew.addEventListener('click', openNew);
    const dashQuickNew = document.getElementById('dash-quick-new');
    if(dashQuickNew) dashQuickNew.addEventListener('click', openNew);
    const dashQuickOp = document.getElementById('dash-quick-oportunidad');
    if(dashQuickOp) dashQuickOp.addEventListener('click', ()=> openNuevaOportunidad());
    document.querySelectorAll('.quick-actions [data-view]').forEach(b=>{
      b.addEventListener('click', ()=> setView(b.getAttribute('data-view')));
    });
    if(view === 'industrial'){
      const indNuevo=document.getElementById('ind-nuevo'); if(indNuevo) indNuevo.addEventListener('click', openNew);
      const indOp=document.getElementById('ind-oportunidad'); if(indOp) indOp.addEventListener('click', ()=>openNuevaOportunidad());
      const indBackup=document.getElementById('ind-respaldo'); if(indBackup) indBackup.addEventListener('click', exportarRespaldoIndustrial);

        b.addEventListener('click', ()=> setView(b.getAttribute('data-ind-view')));

    document.querySelectorAll('[data-cliente-riesgo]').forEach(b=>{

        clienteSeleccionadoTipo = 'mantenimiento';
        animateViewChange = true;
        render();
      });

    if(view === 'caja'){
      const btnAbrir = document.getElementById('btn-abrir-caja');

      document.querySelectorAll('[data-ir-fecha]').forEach(row=>{
        row.addEventListener('click', ()=> irACajaFecha(row.getAttribute('data-ir-fecha')));
      });

    if(view === 'inventario'){

          b.addEventListener('click', ()=> openEditarOportunidad(b.getAttribute('data-id')));

        document.querySelectorAll('[data-action="eliminar-oportunidad"]').forEach(b=>{

  function serviciosChecksHTML(idSuf, seleccionados, precios, checkClass){
    precios = precios || {};
    return SERVICIO_GRUPOS.map((grupo, gi) => {
      const itemsHTML = grupo.items.map(s => {
        const checked = (seleccionados||[]).includes(s);
        return `
        <label class="service-check service-check-priced">
          <input type="checkbox" class="${checkClass}" data-servicio-check="${idSuf}" value="${esc(s)}" ${checked ? 'checked':''}/>
          <span class="servicio-icon">${ICONOS_SERVICIO[s]||''}</span>
          <span>${s}</span>
          <input type="number" class="servicio-precio-input" data-servicio-precio="${idSuf}" data-servicio-nombre="${esc(s)}" min="0" step="0.01" placeholder="₡0" value="${precios[s] || ''}" style="${checked?'':'display:none;'}"/>
        </label>`;
      }).join('');
      return `<div class="service-group-title"${gi===0?' style="margin-top:0;padding-top:0;border-top:none;"':''}>${grupo.titulo}</div>${itemsHTML}`;
    }).join('');
  }

  function capturarLineasDesdeDOM(recalcularTotal){
    // Antes de re-renderizar (al agregar/quitar línea), guarda lo que el usuario ya escribió.
    formLineas = formLineas.map(l => {
      const tipoEl = document.getElementById(`f-tipo-${l.lid}`);
      if(!tipoEl) return l; // línea nueva sin DOM todavía
      const servicioPrecios = {};
      document.querySelectorAll(`[data-servicio-precio="${l.lid}"]`).forEach(inp=>{
        const nombre = inp.getAttribute('data-servicio-nombre');
        if(inp.value) servicioPrecios[nombre] = inp.value;
      });
      const servicios = Array.from(document.querySelectorAll(`.f-servicio-check-${l.lid}:checked`)).map(el => el.value);
      let precio = document.getElementById(`f-precio-${l.lid}`).value;
      if(recalcularTotal){
        const suma = servicios.reduce((s,nombre)=> s + (parseFloat(servicioPrecios[nombre])||0), 0);
        if(suma > 0) precio = String(suma);
      }
      return {
        ...l,
        tipo: tipoEl.value,
        capacidad: document.getElementById(`f-capacidad-${l.lid}`).value,
        cantidad: document.getElementById(`f-cantidad-${l.lid}`).value,
        estado: document.getElementById(`f-estado-${l.lid}`).value,
        precio,
        abono: document.getElementById(`f-abono-${l.lid}`).value,
        pagado: document.getElementById(`f-pagado-${l.lid}`).value,
        servicios,
        servicioPrecios,
      };
    });
  }

        focusedId = activeEl.id;

        b.addEventListener('click', ()=> { capturarDatosOrden(); capturarLineasDesdeDOM(); quitarLinea(b.getAttribute('data-remove-linea')); });
      });
      document.querySelectorAll('[data-servicio-check]').forEach(chk=>{
        chk.addEventListener('change', ()=> {
          const precioInput = chk.closest('.service-check-priced').querySelector('.servicio-precio-input');
          precioInput.style.display = chk.checked ? '' : 'none';
          if(!chk.checked) precioInput.value = '';
          capturarDatosOrden();
          capturarLineasDesdeDOM(true);
          renderModal(true, true);
        });
      });
      document.querySelectorAll('.servicio-precio-input').forEach(inp=>{
        inp.addEventListener('input', ()=> {
          // Recalcula el total en el DOM directamente, sin recrear el formulario (evita perder el foco/scroll).
          const lid = inp.getAttribute('data-servicio-precio');
          const totalInput = document.getElementById(`f-precio-${lid}`);
          if(totalInput){
            let suma = 0;
            document.querySelectorAll(`[data-servicio-precio="${lid}"]`).forEach(precioEl=>{
              const checkbox = document.querySelector(`.f-servicio-check-${lid}[value="${precioEl.getAttribute('data-servicio-nombre')}"]`);
              if(checkbox && checkbox.checked && precioEl.value) suma += parseFloat(precioEl.value) || 0;
            });
            if(suma > 0) totalInput.value = suma;
          }
        });
        inp.addEventListener('change', ()=> { capturarDatosOrden(); capturarLineasDesdeDOM(); });
      });
      formLineas.forEach(l=>{
        const totalInput = document.getElementById(`f-precio-${l.lid}`);
        if(totalInput) totalInput.addEventListener('change', ()=> { capturarDatosOrden(); capturarLineasDesdeDOM(); });
      });
    } else {
      const capturarFormEdicion = (recalcularTotal)=>{
        const servicioPrecios = {};
        document.querySelectorAll('[data-servicio-precio="edit"]').forEach(inp=>{
          const nombre = inp.getAttribute('data-servicio-nombre');
          if(inp.value) servicioPrecios[nombre] = inp.value;
        });
        const servicios = Array.from(document.querySelectorAll('.f-servicio-check:checked')).map(el => el.value);
        let precio = document.getElementById('f-precio').value;
        if(recalcularTotal){
          const suma = servicios.reduce((s,nombre)=> s + (parseFloat(servicioPrecios[nombre])||0), 0);
          if(suma > 0) precio = String(suma);
        }
        form = { ...form, precio, servicios, servicioPrecios };
      };
      document.querySelectorAll('[data-servicio-check]').forEach(chk=>{
        chk.addEventListener('change', ()=> {
          const precioInput = chk.closest('.service-check-priced').querySelector('.servicio-precio-input');
          precioInput.style.display = chk.checked ? '' : 'none';
          if(!chk.checked) precioInput.value = '';
          capturarFormEdicion(true);
          renderModal(true);
        });
      });
      document.querySelectorAll('.servicio-precio-input').forEach(inp=>{
        inp.addEventListener('input', ()=> {
          // Recalcula el total en el DOM directamente, sin recrear el formulario (evita perder el foco/scroll).
          const totalInput = document.getElementById('f-precio');
          if(totalInput){
            let suma = 0;
            document.querySelectorAll('[data-servicio-precio="edit"]').forEach(precioEl=>{
              const checkbox = document.querySelector(`.f-servicio-check[value="${precioEl.getAttribute('data-servicio-nombre')}"]`);
              if(checkbox && checkbox.checked && precioEl.value) suma += parseFloat(precioEl.value) || 0;
            });
            if(suma > 0) totalInput.value = suma;
          }
        });
        inp.addEventListener('change', ()=> { capturarFormEdicion(); });
      });
      const totalInputEdit = document.getElementById('f-precio');
      if(totalInputEdit) totalInputEdit.addEventListener('change', ()=> { capturarFormEdicion(); });
    }
  }

  window.addEventListener('beforeunload', function(e){
    if(!lastSaveVerified){
      e.preventDefault();
      e.returnValue = '';
    }
  });

  initAuth();
})();
</script>
