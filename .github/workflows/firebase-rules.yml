name: Firebase Security Rules

on:
  push:
    branches:
      - saneamiento-fase-1
      - principal
  pull_request:
    branches:
      - principal
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/firebase-rules.yml'

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java for Firebase Emulator
        run: java -version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Firestore Security Rules tests
        run: npm run test:rules
